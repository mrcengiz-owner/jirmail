{% extends "base.html" %}

{% block toast %}
{% include "partials/toast.html" %}
{% endblock %}

{% block content %}
<div class="mail-layout" x-data="mailApp()">

    <!-- Column 1: Folder Sidebar -->
    <aside class="mail-folder-panel border-r border-slate-800/50 flex flex-col h-full"
           :class="{ 'hidden': mobileView !== 'folders', 'flex': mobileView === 'folders', 'md:flex': true }">

        <!-- Mobile Header -->
        <div class="md:hidden flex items-center justify-between p-4 border-b border-slate-800/50">
            <div class="flex items-center gap-2">
                <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-primary-500 to-primary-700 flex items-center justify-center">
                    <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <span class="font-bold text-white">Jîr-Mail</span>
            </div>
            <button @click="sidebarOpen = false" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
            </button>
        </div>

        <!-- Compose Button -->
        <div class="p-4">
            <button @click="showCompose = true; mobileView = 'detail'"
                    class="w-full bg-primary-600 hover:bg-primary-500 text-white font-semibold py-3 px-4 rounded-xl shadow-lg shadow-primary-500/20 transition-all hover:scale-[1.02] active:scale-95 flex items-center justify-center gap-2">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Compose
            </button>
        </div>

        <!-- Folder Navigation -->
        <nav class="flex-1 px-3 overflow-y-auto">
            <div class="mb-3">
                <span class="px-3 text-xs font-semibold text-slate-500 uppercase tracking-wider">Mailboxes</span>
            </div>

            <button @click="currentFolder = 'inbox'; mobileView = 'list'"
                    class="nav-item w-full mb-1"
                    :class="currentFolder === 'inbox' ? 'active' : ''">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                <span>Inbox</span>
                <span x-show="unreadCount > 0"
                      class="ml-auto bg-primary-500/20 text-primary-400 px-2 py-0.5 rounded-full text-xs font-bold"
                      x-text="unreadCount">0</span>
            </button>

            <button @click="currentFolder = 'starred'; mobileView = 'list'"
                    class="nav-item w-full mb-1"
                    :class="currentFolder === 'starred' ? 'active' : ''">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                </svg>
                <span>Starred</span>
            </button>

            <button @click="currentFolder = 'sent'; mobileView = 'list'"
                    class="nav-item w-full mb-1"
                    :class="currentFolder === 'sent' ? 'active' : ''">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
                <span>Sent</span>
            </button>

            <button @click="currentFolder = 'drafts'; mobileView = 'list'"
                    class="nav-item w-full mb-1"
                    :class="currentFolder === 'drafts' ? 'active' : ''">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                <span>Drafts</span>
            </button>

            <button @click="currentFolder = 'trash'; mobileView = 'list'"
                    class="nav-item w-full mb-1"
                    :class="currentFolder === 'trash' ? 'active' : ''">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                <span>Trash</span>
            </button>
        </nav>

        <!-- User Info & Logout -->
        <div class="p-4 border-t border-slate-800/50">
            <div class="flex items-center gap-3 mb-4">
                <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-700 rounded-full flex items-center justify-center text-white font-bold text-sm"
                     x-text="'{{ email }}'.charAt(0).toUpperCase()">A</div>
                <div class="overflow-hidden">
                    <p class="text-sm font-medium text-white truncate" x-text="'{{ email }}'"></p>
                    <p class="text-xs text-slate-500">Connected</p>
                </div>
            </div>
            <form method="POST" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit"
                        class="w-full flex items-center justify-center gap-2 px-3 py-2.5 rounded-xl text-slate-400 hover:bg-red-500/10 hover:text-red-400 transition-colors text-sm font-medium">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Logout
                </button>
            </form>
        </div>
    </aside>

    <!-- Column 2: Mail List -->
    <div class="mail-list-panel border-r border-slate-800/50 flex-col"
         :class="{ 'hidden': mobileView !== 'list', 'flex': mobileView === 'list', 'md:flex': true }">

        <!-- Mobile Back Button -->
        <div class="md:hidden flex items-center gap-2 p-3 border-b border-slate-800/50">
            <button @click="mobileView = 'folders'" aria-label="Back to folders"
                    class="p-2 rounded-lg text-slate-400 hover:bg-slate-800">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span class="font-medium text-white capitalize" x-text="currentFolder"></span>
        </div>

        <!-- Search Bar -->
        <div class="p-4 border-b border-slate-800/50">
            <div class="relative">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <svg class="h-5 w-5 text-slate-500" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                    </svg>
                </div>
                <input type="text"
                       x-model="searchQuery"
                       @input="filterMails()"
                       placeholder="Search in mails..."
                       aria-label="Search emails"
                       class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2.5 text-sm text-white placeholder-slate-500 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all">
            </div>
        </div>

        <!-- Mail List -->
        <div class="flex-1 overflow-y-auto">
            <template x-for="mail in filteredMails" :key="mail.id">
                <div @click="selectMail(mail); mobileView = 'detail'"
                     class="p-4 border-b border-slate-800/30 hover:bg-slate-800/50 cursor-pointer transition-all relative group"
                     :class="selectedMail?.id === mail.id ? 'bg-slate-800/80 before:absolute before:left-0 before:top-0 before:bottom-0 before:w-1 before:bg-primary-500' : ''">
                    <div class="flex justify-between items-center mb-1">
                        <div class="flex items-center gap-2">
                            <span x-show="mail.unread" class="w-2 h-2 rounded-full bg-primary-500 shadow-lg shadow-primary-500/50"></span>
                            <span class="truncate text-sm font-medium"
                                  :class="mail.unread ? 'text-white' : 'text-slate-400'"
                                  x-text="mail.from">Sender</span>
                        </div>
                        <span class="text-xs text-slate-500" x-text="formatDate(mail.date)">Date</span>
                    </div>
                    <div class="text-sm truncate mb-1"
                         :class="mail.unread ? 'font-semibold text-primary-400' : 'font-normal text-slate-500'"
                         x-text="mail.subject">Subject</div>
                    <div class="text-xs text-slate-600 truncate" x-text="mail.preview">Preview...</div>
                </div>
            </template>

            <!-- Empty State -->
            <template x-if="filteredMails.length === 0">
                <div class="p-8 text-center text-slate-500 flex flex-col items-center justify-center h-full">
                    <svg class="h-12 w-12 mb-3 opacity-30" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                    <p>No mails in <span x-text="currentFolder"></span></p>
                </div>
            </template>
        </div>
    </div>

    <!-- Column 3: Mail Detail / Compose -->
    <div class="mail-detail-panel flex-col relative"
         :class="{ 'hidden': mobileView !== 'detail', 'flex': mobileView === 'detail', 'md:flex': true }">

        <!-- Mobile Back Button -->
        <div class="md:hidden flex items-center gap-2 p-3 border-b border-slate-800/50">
            <button @click="mobileView = 'list'; selectedMail = null" aria-label="Back to list"
                    class="p-2 rounded-lg text-slate-400 hover:bg-slate-800">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
            </button>
            <span class="font-medium text-white truncate" x-text="selectedMail?.subject || ''"></span>
        </div>

        <!-- Empty State -->
        <template x-if="!showCompose && !selectedMail">
            <div class="absolute inset-0 flex flex-col items-center justify-center text-slate-600 bg-slate-950/50">
                <div class="w-24 h-24 bg-slate-900 rounded-full flex items-center justify-center mb-6 shadow-inner border border-slate-800">
                    <svg class="w-12 h-12 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <p class="text-lg font-medium text-slate-500">Select an item to read</p>
                <p class="text-sm text-slate-600 mt-2">Nothing is selected</p>
            </div>
        </template>

        <!-- Mail Reading Pane -->
        <template x-if="!showCompose && selectedMail">
            <div class="flex flex-col h-full fade-in">
                <!-- Mail Header -->
                <div class="p-6 border-b border-slate-800/50 bg-slate-900/50">
                    <div class="flex items-start justify-between mb-6">
                        <h2 class="text-xl font-bold text-white leading-tight pr-4" x-text="selectedMail.subject">Subject</h2>
                        <div class="flex items-center gap-2 shrink-0">
                            <button @click="toggleStar(selectedMail)"
                                    class="p-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl transition-all border border-slate-700"
                                    :class="selectedMail.starred ? 'text-amber-400 border-amber-500/30' : 'text-slate-400'">
                                <svg class="h-5 w-5" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                                </svg>
                            </button>
                            <button @click="deleteMail(selectedMail)"
                                    class="p-2.5 bg-slate-800 hover:bg-red-500/20 text-slate-400 hover:text-red-400 rounded-xl transition-all border border-slate-700 hover:border-red-500/30">
                                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>

                    <div class="flex items-center gap-4 p-4 bg-slate-900/50 rounded-2xl border border-slate-800/50">
                        <div class="w-12 h-12 bg-gradient-to-br from-primary-500/20 to-primary-600/20 border border-primary-500/30 rounded-xl flex items-center justify-center text-primary-400 font-bold text-lg"
                             x-text="selectedMail.from.charAt(0).toUpperCase()"></div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-white text-base" x-text="selectedMail.from">Sender</div>
                            <div class="text-sm text-slate-500">to <span class="text-slate-400">me ({{ email }})</span></div>
                        </div>
                        <div class="text-sm font-medium text-slate-400 bg-slate-800 px-3 py-1.5 rounded-lg border border-slate-700" x-text="formatDateTime(selectedMail.date)"></div>
                    </div>
                </div>

                <!-- Mail Body -->
                <div class="flex-1 p-8 overflow-y-auto bg-slate-950/30">
                    <div class="prose prose-invert prose-primary max-w-none text-slate-300 leading-relaxed text-[15px]" x-html="formatBody(selectedMail.body)">
                        Mail body...
                    </div>
                </div>

                <!-- Action Bar -->
                <div class="p-6 border-t border-slate-800/50 bg-slate-900/50 flex items-center gap-4">
                    <button @click="replyTo(selectedMail)"
                            class="px-6 py-2.5 bg-primary-600 hover:bg-primary-500 text-white rounded-xl font-medium text-sm flex items-center gap-2 shadow-lg shadow-primary-500/20 transition-all">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                        </svg>
                        Reply
                    </button>
                    <button @click="forwardMail(selectedMail)"
                            class="px-6 py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-xl font-medium text-sm flex items-center gap-2 border border-slate-700 transition-all">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
                        </svg>
                        Forward
                    </button>
                </div>
            </div>
        </template>

        <!-- Compose Pane -->
        <template x-if="showCompose">
            <div class="flex flex-col h-full fade-in bg-slate-950">
                <div class="p-6 border-b border-slate-800/50 flex items-center justify-between">
                    <h2 class="text-xl font-bold text-white"
                        x-text="composeType === 'reply' ? 'Reply Message' : composeType === 'forward' ? 'Forward Message' : 'New Message'">New Message</h2>
                    <button @click="closeCompose(); mobileView = 'list'"
                            class="p-2.5 hover:bg-slate-800 rounded-xl text-slate-400 hover:text-white transition-colors">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                    </button>
                </div>
                <div class="p-6 space-y-5 flex-1 overflow-y-auto">
                    <div>
                        <input type="email"
                               x-model="composeTo"
                               class="input"
                               placeholder="To: recipient@example.com">
                    </div>
                    <div>
                        <input type="text"
                               x-model="composeSubject"
                               class="input"
                               placeholder="Subject">
                    </div>
                    <div class="h-[400px]">
                        <textarea x-model="composeBody"
                                  class="input resize-none h-full"
                                  placeholder="Write your message here..."></textarea>
                    </div>
                </div>
                <div class="p-6 border-t border-slate-800/50 flex items-center justify-between bg-slate-900/50">
                    <button @click="saveDraft()"
                            class="px-6 py-2.5 text-slate-400 hover:text-white hover:bg-slate-800 rounded-xl font-medium text-sm transition-all border border-transparent hover:border-slate-700">Save as Draft</button>
                    <button @click="sendMail()"
                            :disabled="sendingMail"
                            class="px-8 py-2.5 bg-primary-600 hover:bg-primary-500 disabled:bg-primary-800 disabled:text-primary-400/50 text-white rounded-xl font-medium text-sm flex items-center gap-2 shadow-lg shadow-primary-500/20 transition-all">
                        <template x-if="sendingMail">
                            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                            </svg>
                        </template>
                        <svg x-show="!sendingMail" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                        <span x-text="sendingMail ? 'Sending...' : 'Send Message'">Send</span>
                    </button>
                </div>
            </div>
        </template>
    </div>

</div>
{% endblock %}
