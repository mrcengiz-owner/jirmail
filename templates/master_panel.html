{% extends "base.html" %}
{% load static %}

{% block sidebar %}
{% include "partials/sidebar.html" %}
{% endblock %}

{% block toast %}
{% include "partials/toast.html" %}
{% endblock %}

{% block content %}
<div class="flex h-full pt-14 md:pt-0">
    <!-- HTMX loading indicator -->
    <div class="htmx-indicator fixed top-0 left-0 right-0 h-1 bg-primary-500 z-50 animate-pulse"></div>
    
    <div class="flex-1 overflow-auto h-full relative overflow-x-hidden"
         id="content-area"
         hx-get="/api/content/dashboard/"
         hx-trigger="load">
        <div class="flex items-center justify-center h-full text-slate-500">
            <svg class="animate-spin h-8 w-8 text-primary-500" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
        </div>
    </div>
</div>
{% endblock %}
