{% extends "base.html" %}

{% block body %}
<div x-data="masterPanel()" x-init="init()" class="flex h-screen overflow-hidden">

    <aside class="w-64 bg-slate-800/80 border-r border-slate-700 flex flex-col">
        <div class="p-4 border-b border-slate-700">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 bg-gradient-to-br from-amber-500 to-orange-600 rounded-lg flex items-center justify-center">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2" />
                    </svg>
                </div>
                <div>
                    <h1 class="text-lg font-bold text-white">Jîr-Mail</h1>
                    <p class="text-xs text-amber-400/80">Command Center</p>
                </div>
            </div>
        </div>

        <nav class="flex-1 p-4 space-y-1">
            <button @click="activeTab = 'dashboard'" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" :class="activeTab === 'dashboard' ? 'bg-amber-500/10 text-amber-400 border-l-2 border-amber-500' : 'text-slate-400 hover:bg-slate-700/50 hover:text-white border-l-2 border-transparent'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 3v2m6-2v2M9 19v2m6-2v2M5 9H3m2 6H3m18-6h-2m2 6h-2M7 19h10a2 2 0 002-2V7a2 2 0 00-2-2H7a2 2 0 00-2 2v10a2 2 0 002 2zM9 9h6v6H9V9z" />
                </svg>
                <span class="font-medium">System Specs</span>
            </button>
            <button @click="activeTab = 'domains'" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" :class="activeTab === 'domains' ? 'bg-amber-500/10 text-amber-400 border-l-2 border-amber-500' : 'text-slate-400 hover:bg-slate-700/50 hover:text-white border-l-2 border-transparent'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0 3-4.03 3-9s-1.343-9-3-9m-9 9a9 9 0 019-9" />
                </svg>
                <span>Domain Control</span>
            </button>
            <button @click="activeTab = 'accounts'" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" :class="activeTab === 'accounts' ? 'bg-amber-500/10 text-amber-400 border-l-2 border-amber-500' : 'text-slate-400 hover:bg-slate-700/50 hover:text-white border-l-2 border-transparent'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
                </svg>
                <span>Mail Accounts</span>
            </button>
            <button @click="activeTab = 'backup'" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" :class="activeTab === 'backup' ? 'bg-amber-500/10 text-amber-400 border-l-2 border-amber-500' : 'text-slate-400 hover:bg-slate-700/50 hover:text-white border-l-2 border-transparent'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>
                <span>Backup</span>
            </button>
            <button @click="activeTab = 'logs'" class="w-full flex items-center gap-3 px-4 py-3 rounded-lg transition-colors" :class="activeTab === 'logs' ? 'bg-amber-500/10 text-amber-400 border-l-2 border-amber-500' : 'text-slate-400 hover:bg-slate-700/50 hover:text-white border-l-2 border-transparent'">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
                <span>User Logs</span>
            </button>
        </nav>

        <div class="p-4 border-t border-slate-700">
            <div class="bg-slate-900/50 rounded-lg p-3">
                <div class="text-xs text-slate-500 mb-1">INSTANCE</div>
                <div class="text-sm text-amber-400 font-mono">{{ instance_id }}</div>
                <div class="text-xs text-slate-400 mt-1">{{ tier }}</div>
            </div>
            <a href="/logout" class="mt-3 flex items-center gap-2 px-4 py-2 rounded-lg bg-red-500/10 hover:bg-red-500/20 text-red-400 transition-colors">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" />
                </svg>
                <span class="text-sm">Logout</span>
            </a>
        </div>
    </aside>

    <main class="flex-1 overflow-auto">
        {% include "master_panel_content.html" %}
    </main>
</div>

<script>
function masterPanel() {
    return {
        activeTab: 'dashboard',
        JIR_KEY: '{{ JIR_LOCAL_KEY }}',

        specs: {
            cpu_percent: 0,
            ram_percent: 0,
            ram_used_gb: 0,
            ram_total_gb: 0,
            disk_percent: 0,
            disk_used_gb: 0,
            disk_total_gb: 0,
            total_container_cpu: 0,
            total_container_ram_mb: 0,
            docker_containers: []
        },

        accounts: [],
        domains: [],
        backups: [],
        logs: [],
        logFilter: '',

        showAddModal: false,
        showAddDomainModal: false,
        showDeleteConfirm: false,
        showDNSModalFlag: false,
        selectedDomain: null,
        selectedAccount: null,

        newAccount: { username: '', domain: '', password: '' },
        newDomain: { name: '' },

        init() {
            this.fetchSpecs();
            this.fetchAccounts();
            this.fetchDomains();
            this.fetchBackups();
            this.fetchLogs();

            setInterval(() => this.fetchSpecs(), 30000);
        },

        refreshAll() {
            this.fetchSpecs();
            this.fetchAccounts();
            this.fetchDomains();
            this.fetchBackups();
            this.fetchLogs();
        },

        async fetchSpecs() {
            try {
                const res = await fetch('/api/management/system-specs');
                if (res.ok) {
                    this.specs = await res.json();
                }
            } catch (e) { console.error('Specs fetch error:', e); }
        },

        async fetchAccounts() {
            try {
                const res = await fetch('/api/core/list-accounts?key=' + this.JIR_KEY);
                const data = await res.json();
                if (data.status === 'success') {
                    this.accounts = data.accounts || [];
                }
            } catch (e) { console.error('Accounts fetch error:', e); }
        },

        async fetchDomains() {
            try {
                const res = await fetch('/api/core/list-domains?key=' + this.JIR_KEY);
                const data = await res.json();
                if (data.status === 'success') {
                    this.domains = data.domains || [];
                }
            } catch (e) { console.error('Domains fetch error:', e); }
        },

        async fetchBackups() {
            try {
                const res = await fetch('/api/backup/list-backups');
                if (res.ok) {
                    this.backups = await res.json();
                }
            } catch (e) { console.error('Backups fetch error:', e); }
        },

        async fetchLogs() {
            try {
                const url = '/api/management/logs?key=' + this.JIR_KEY + '&lines=50' + (this.logFilter ? '&filter_type=' + this.logFilter : '');
                const res = await fetch(url);
                if (res.ok) {
                    this.logs = await res.json();
                }
            } catch (e) { console.error('Logs fetch error:', e); }
        },

        async createAccount() {
            if (!this.newAccount.username || !this.newAccount.password) {
                alert('Username and password are required');
                return;
            }
            try {
                const res = await fetch('/api/management/create-account', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(this.newAccount)
                });
                const data = await res.json();
                if (data.status === 'success') {
                    this.showAddModal = false;
                    this.newAccount = { username: '', domain: '', password: '' };
                    this.fetchAccounts();
                } else {
                    alert(data.message || 'Failed to create account');
                }
            } catch (e) { console.error('Create account error:', e); }
        },

        async toggleAccount(email) {
            try {
                const res = await fetch('/api/core/toggle-account/' + encodeURIComponent(email) + '?key=' + this.JIR_KEY, { method: 'PATCH' });
                const data = await res.json();
                if (data.status === 'success') {
                    this.fetchAccounts();
                }
            } catch (e) { console.error('Toggle account error:', e); }
        },

        async toggleDomain(domain) {
            try {
                const res = await fetch('/api/core/toggle-domain/' + domain.name + '?key=' + this.JIR_KEY, { method: 'PATCH' });
                const data = await res.json();
                if (data.status === 'success') {
                    domain.is_active = data.is_active;
                }
            } catch (e) { console.error('Toggle domain error:', e); }
        },

        showDNSModal(domain) {
            this.selectedDomain = domain;
            this.showDNSModalFlag = true;
        },

        copyToClipboard(text) {
            if (!text) return;
            navigator.clipboard.writeText(text).then(() => {
                alert('Copied to clipboard!');
            }).catch(() => {
                console.error('Failed to copy');
            });
        },

        deleteAccount(account) {
            this.selectedAccount = account;
            this.showDeleteConfirm = true;
        },

        async confirmDelete() {
            if (!this.selectedAccount) return;
            try {
                const res = await fetch('/api/core/delete-account/' + encodeURIComponent(this.selectedAccount.email) + '?key=' + this.JIR_KEY, { method: 'DELETE' });
                const data = await res.json();
                if (data.status === 'success') {
                    this.showDeleteConfirm = false;
                    this.selectedAccount = null;
                    this.fetchAccounts();
                } else {
                    alert(data.message || 'Failed to delete');
                }
            } catch (e) { console.error('Delete account error:', e); }
        },

        async createBackup() {
            if (!confirm('Create a full backup now?')) return;
            try {
                const res = await fetch('/api/backup/create-backup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        backup_type: 'full',
                        include_emails: false,
                        include_configs: true,
                        include_database: true
                    })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    this.fetchBackups();
                    alert('Backup created successfully');
                } else {
                    alert(data.message || 'Failed to create backup');
                }
            } catch (e) { console.error('Create backup error:', e); }
        },

        async restoreBackup(backup) {
            if (!confirm('Restore from this backup?')) return;
            try {
                const res = await fetch('/api/backup/restore-backup', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        backup_id: backup.id,
                        restore_emails: true,
                        restore_configs: true,
                        restore_database: true
                    })
                });
                const data = await res.json();
                alert(data.message || 'Restore completed');
            } catch (e) { console.error('Restore backup error:', e); }
        },

        async createDomain() {
            if (!this.newDomain.name) {
                alert('Domain name is required');
                return;
            }
            try {
                const res = await fetch('/api/core/add-domain?key=' + this.JIR_KEY, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name: this.newDomain.name, is_active: true })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    this.showAddDomainModal = false;
                    this.newDomain = { name: '' };
                    this.fetchDomains();
                } else {
                    alert(data.message || 'Failed to add domain');
                }
            } catch (e) { console.error('Create domain error:', e); }
        },

        async generateDNS(domain) {
            try {
                const res = await fetch('/api/core/generate-dns-records/' + domain.name + '?key=' + this.JIR_KEY, { method: 'POST' });
                const data = await res.json();
                if (data.status === 'success') {
                    this.fetchDomains();
                } else {
                    alert(data.message || 'Failed to generate DNS');
                }
            } catch (e) { console.error('Generate DNS error:', e); }
        },

        getRoleLabel(role) {
            const labels = { 'FULL': 'Full Access', 'SEND': 'Send Only', 'RECV': 'Receive Only', 'BLOCK': 'Internal' };
            return labels[role] || role;
        }
    };
}
</script>
{% endblock %}
