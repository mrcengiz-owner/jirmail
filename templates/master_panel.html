{% extends "base.html" %}
{% load static %}

{% block sidebar %}
{% include "partials/sidebar.html" %}
{% endblock %}

{% block toast %}
{% include "partials/toast.html" %}
{% endblock %}

{% block extra_head %}
<script>
    window.JIR_KEY = "{{ JIR_KEY|escapejs }}";
    window.INSTANCE_ID = "{{ instance_id|escapejs }}";
    window.TIER = "{{ tier|escapejs }}";
</script>
{% endblock %}

{% block content %}
<!-- Initial content - will be replaced by HTMX -->
<div id="dashboard-init" class="p-6">
    <div class="flex items-center justify-center h-64">
        <div class="text-center">
            <svg class="animate-spin h-10 w-10 text-emerald-500 mx-auto mb-4" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            <p class="text-slate-400 text-sm">Dashboard yükleniyor...</p>
        </div>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', function() {
        setTimeout(function() {
            var el = document.getElementById('content-inner');
            if (el && el.querySelector('#dashboard-init')) {
                htmx.ajax('GET', '/api/content/dashboard/', {target: '#content-inner', swap: 'innerHTML'});
            }
        }, 100);
    });
</script>
{% endblock %}
