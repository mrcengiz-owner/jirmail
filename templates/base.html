{% load static %}
<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="description" content="Jîr-Mail - Professional Mail Hosting Command Center">
    <title>{% block title %}Jîr-Mail{% endblock %}</title>

    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'light') {
                    document.documentElement.classList.remove('dark');
                } else if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body x-data="{ sidebarOpen: false }" class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden dark:bg-slate-950 dark:text-slate-100">

{% block sidebar %}{% endblock %}

<div x-show="sidebarOpen"
     @click="sidebarOpen = false"
     x-transition:enter="transition-opacity ease-linear duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition-opacity ease-linear duration-300"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 z-40 md:hidden"
     x-cloak>
</div>

<main id="content-area" class="flex-1 overflow-y-auto relative h-full">
    {% block content %}{% endblock %}
</main>

{% block toast %}{% endblock %}

<script src="{% static 'js/app.js' %}"></script>
{% block extra_scripts %}{% endblock %}

</body>
</html>
