{% load static %}
<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="description" content="Jîr-Mail - Professional Mail Hosting Command Center">
    <title>{% block title %}Jîr-Mail{% endblock %}</title>

    <script>
        (function() {
            try {
                var theme = localStorage.getItem('theme');
                if (theme === 'light') {
                    document.documentElement.classList.remove('dark');
                } else if (theme === 'dark') {
                    document.documentElement.classList.add('dark');
                } else if (window.matchMedia('(prefers-color-scheme: dark)').matches) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.add('dark');
                }
            } catch(e) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        primary: {
                            50: '#ecfdf5', 100: '#d1fae5', 200: '#a7f3d0', 300: '#6ee7b7',
                            400: '#34d399', 500: '#10b981', 600: '#059669', 700: '#047857',
                            800: '#065f46', 900: '#064e3b', 950: '#022c22',
                        },
                        success: { 400: '#4ade80', 500: '#22c55e', 600: '#16a34a' },
                        danger: { 400: '#f87171', 500: '#ef4444', 600: '#dc2626' },
                        warning: { 400: '#fbbf24', 500: '#f59e0b', 600: '#d97706' },
                        info: { 400: '#60a5fa', 500: '#3b82f6', 600: '#2563eb' }
                    }
                }
            }
        }
    </script>

    <!-- Custom Theme CSS -->
    <link rel="stylesheet" href="{% static 'css/main.css' %}">

    <!-- Alpine.js & HTMX & Flowbite -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <script src="https://cdn.jsdelivr.net/npm/flowbite@2.3.0/dist/flowbite.min.js"></script>

    {% block extra_head %}{% endblock %}
</head>
<body x-data="{ sidebarOpen: false }" class="bg-slate-950 text-slate-100 h-screen flex overflow-hidden dark:bg-slate-950 dark:text-slate-100">

{% block sidebar %}{% endblock %}

<div x-show="sidebarOpen"
     @click="sidebarOpen = false"
     x-transition:enter="transition-opacity ease-linear duration-300"
     x-transition:enter-start="opacity-0"
     x-transition:enter-end="opacity-100"
     x-transition:leave="transition-opacity ease-linear duration-300"
     x-transition:leave-start="opacity-100"
     x-transition:leave-end="opacity-0"
     class="fixed inset-0 bg-black/50 z-40 md:hidden"
     x-cloak>
</div>

<main id="content-area" class="flex-1 overflow-y-auto relative h-full">
    {% block content %}{% endblock %}
</main>

{% block toast %}{% endblock %}

<script src="{% static 'js/app.js' %}"></script>
{% block extra_scripts %}{% endblock %}

</body>
</html>
