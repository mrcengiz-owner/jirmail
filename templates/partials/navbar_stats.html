<!-- templates/partials/navbar_stats.html -->
{% load static %}
{% spaceless %}
<!-- Aktif Domain Metriği -->
<div class="hidden xs:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/40 border border-slate-700/30">
    <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
    <span class="text-[11px] font-medium text-slate-400">Aktif Domain</span>
    <span class="text-sm font-bold text-emerald-400 tabular-nums" id="navbar-active-domains">{{ active_domains }}</span>
</div>

<!-- Aktif Hesap Metriği -->
<div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/40 border border-slate-700/30">
    <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
    </svg>
    <span class="text-[11px] font-medium text-slate-400">Aktif Hesap</span>
    <span class="text-sm font-bold text-emerald-400 tabular-nums" id="navbar-active-accounts">{{ active_accounts }}</span>
</div>

<!-- Pasif Hesap Metriği -->
<div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/40 border border-slate-700/30">
    <svg class="w-3.5 h-3.5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
    </svg>
    <span class="text-[11px] font-medium text-slate-400">Pasif Hesap</span>
    <span class="text-sm font-bold text-amber-400 tabular-nums" id="navbar-inactive-accounts">{{ inactive_accounts }}</span>
</div>
{% endspaceless %}
