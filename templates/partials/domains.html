<!-- templates/partials/domains.html -->
<div class="p-8 fade-in htmx-fade" id="domains-content" x-data="{
    domains: [],
    loading: false,
    showAddModal: false,
    adding: false,
    addError: null,
    newDomain: { name: '', is_active: true },
    showDNSModal: false,
    selectedDomain: null,
    generatingDNS: null,
    getKey() { return window.JIR_KEY || '{{ JIR_LOCAL_KEY }}'; },
    async init() { await this.fetchDomains(); },
    async fetchDomains() {
        this.loading = true;
        try {
            const res = await fetch('/api/core/list-domains?key=' + this.getKey());
            if (res.ok) { const d = await res.json(); this.domains = d.status === 'success' ? (d.domains || []) : []; }
        } catch(e) { console.error(e); } finally { this.loading = false; }
    },
    openAddModal() {
        this.newDomain = { name: '', is_active: true }; this.addError = null; this.showAddModal = true;
        this.$nextTick(() => document.getElementById('new-domain-name')?.focus());
    },
    async addDomain() {
        if (!this.newDomain.name.trim()) { this.addError = 'Domain adı zorunludur.'; return; }
        const rx = /^[a-zA-Z0-9][a-zA-Z0-9-]{0,61}[a-zA-Z0-9]?\.[a-zA-Z]{2,}$/;
        if (!rx.test(this.newDomain.name.trim())) { this.addError = 'Geçerli bir domain girin (örn: example.com)'; return; }
        this.adding = true; this.addError = null;
        try {
            const csrf = document.querySelector('meta[name=csrf-token]')?.content || '';
            const res = await fetch('/api/core/add-domain?key=' + this.getKey(), {
                method: 'POST', headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrf },
                body: JSON.stringify({ name: this.newDomain.name.trim().toLowerCase(), is_active: this.newDomain.is_active })
            });
            const d = await res.json();
            if (d.status === 'success') { window.showToast('Domain eklendi.', 'success'); this.showAddModal = false; await this.fetchDomains(); }
            else { this.addError = d.message || 'Domain eklenemedi.'; }
        } catch(e) { this.addError = 'Bağlantı hatası.'; } finally { this.adding = false; }
    },
    async toggleDomain(domain) {
        try {
            const csrf = document.querySelector('meta[name=csrf-token]')?.content || '';
            const res = await fetch('/api/core/toggle-domain/' + domain.name + '?key=' + this.getKey(), { method: 'PATCH', headers: { 'X-CSRFToken': csrf } });
            const d = await res.json();
            if (d.status === 'success') { domain.is_active = d.is_active; window.showToast(domain.name + ' güncellendi.', 'success'); }
            else { window.showToast(d.message || 'Hata.', 'error'); }
        } catch(e) { window.showToast('Bağlantı hatası.', 'error'); }
    },
    async deleteDomain(domain) {
        if (!confirm(domain.name + ' silinsin mi?')) return;
        try {
            const csrf = document.querySelector('meta[name=csrf-token]')?.content || '';
            const res = await fetch('/api/core/delete-domain/' + domain.name + '?key=' + this.getKey(), { method: 'DELETE', headers: { 'X-CSRFToken': csrf } });
            const d = await res.json();
            if (d.status === 'success') { window.showToast('Silindi.', 'success'); await this.fetchDomains(); }
            else { window.showToast(d.message || 'Silinemedi.', 'error'); }
        } catch(e) { window.showToast('Bağlantı hatası.', 'error'); }
    },
    async generateDNS(domain) {
        this.generatingDNS = domain.name;
        try {
            const csrf = document.querySelector('meta[name=csrf-token]')?.content || '';
            const res = await fetch('/api/core/generate-dns-records/' + domain.name + '?key=' + this.getKey(), { method: 'POST', headers: { 'X-CSRFToken': csrf } });
            const d = await res.json();
            if (d.status === 'success') {
                domain.spf_record = d.spf_record; domain.dkim_record = d.dkim_record; domain.dmarc_record = d.dmarc_record;
                if (this.selectedDomain && this.selectedDomain.name === domain.name) this.selectedDomain = Object.assign({}, this.selectedDomain, domain);
                window.showToast('DNS kayıtları oluşturuldu.', 'success');
            } else { window.showToast(d.message || 'DNS hatası.', 'error'); }
        } catch(e) { window.showToast('Bağlantı hatası.', 'error'); } finally { this.generatingDNS = null; }
    },
    openDNSModal(domain) { this.selectedDomain = Object.assign({}, domain); this.showDNSModal = true; },
    async verifyDomain(domain) {
        try {
            const csrf = document.querySelector('meta[name=csrf-token]')?.content || '';
            const res = await fetch('/api/core/verify-domain/' + domain.name + '?key=' + this.getKey(), { method: 'POST', headers: { 'X-CSRFToken': csrf } });
            const d = await res.json();
            if (d.status === 'success') {
                domain.verification_status = 'verified';
                if (this.selectedDomain && this.selectedDomain.name === domain.name) this.selectedDomain.verification_status = 'verified';
                window.showToast('Doğrulandı.', 'success'); await this.fetchDomains();
            } else { window.showToast(d.message || 'Doğrulama hatası.', 'error'); }
        } catch(e) { window.showToast('Bağlantı hatası.', 'error'); }
    }
}">

    <!-- HEADER -->
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">Domain Management</h2>
            <p class="text-gray-500 dark:text-slate-400 mt-1">
                <span class="text-primary-500 font-semibold" x-text="domains.length">0</span> domains active on this instance
            </p>
        </div>
        <button @click="openAddModal()"
                class="px-5 py-2.5 bg-primary-600 hover:bg-primary-500 text-white rounded-xl text-sm font-medium flex items-center gap-2 shadow-lg shadow-primary-500/20 transition-all active:scale-95">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
            </svg>
            Add Domain
        </button>
    </div>

    <!-- DOMAIN CARDS -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <template x-for="domain in domains" :key="domain.id">
            <div class="bg-white dark:bg-slate-800/50 border border-gray-200 dark:border-slate-700 hover:border-primary-500/30 rounded-2xl p-6 transition-all group relative overflow-hidden">
                <div class="absolute -right-12 -top-12 w-32 h-32 bg-primary-500/5 blur-3xl rounded-full group-hover:bg-primary-500/10 transition-colors"></div>

                <div class="flex items-center justify-between mb-5 relative">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 bg-primary-500/10 border border-primary-500/20 rounded-xl flex items-center justify-center text-primary-400">
                            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0 3-4.03 3-9s-1.343-9-3-9m-9 9a9 9 0 019-9"/>
                            </svg>
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-gray-900 dark:text-white" x-text="domain.name"></h3>
                            <div class="flex items-center gap-2 mt-0.5">
                                <span class="w-2 h-2 rounded-full" :class="domain.is_active ? 'bg-success-500' : 'bg-gray-400'"></span>
                                <span class="text-xs font-medium uppercase tracking-widest"
                                      :class="domain.is_active ? 'text-success-500' : 'text-gray-400'"
                                      x-text="domain.is_active ? 'Active' : 'Inactive'"></span>
                            </div>
                        </div>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="px-2.5 py-1 rounded-full text-xs font-semibold border" :class="{
                            'bg-success-500/10 text-success-500 border-success-500/20': domain.verification_status === 'verified',
                            'bg-warning-500/10 text-warning-500 border-warning-500/20': domain.verification_status === 'pending' || !domain.verification_status,
                            'bg-danger-500/10 text-danger-500 border-danger-500/20': domain.verification_status === 'failed'
                        }" x-text="domain.verification_status || 'pending'"></span>
                        <button @click="openDNSModal(domain)" aria-label="DNS kayıtları"
                                class="p-2 hover:bg-gray-100 dark:hover:bg-slate-700 rounded-lg text-gray-400 hover:text-gray-700 dark:hover:text-white transition-colors">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="p-3 bg-gray-50 dark:bg-slate-900/50 rounded-xl border border-gray-200 dark:border-slate-800">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">SPF</span>
                        <span class="text-xs font-mono text-gray-600 dark:text-slate-300 truncate block"
                              x-text="domain.spf_record ? 'Configured' : 'Not set'"></span>
                    </div>
                    <div class="p-3 bg-gray-50 dark:bg-slate-900/50 rounded-xl border border-gray-200 dark:border-slate-800">
                        <span class="text-[10px] font-bold text-gray-400 uppercase tracking-widest block mb-1">DKIM</span>
                        <span class="text-xs font-mono text-gray-600 dark:text-slate-300 truncate block"
                              x-text="domain.dkim_record ? 'Active' : 'Missing'"></span>
                    </div>
                </div>

                <div class="flex items-center gap-2">
                    <button @click="generateDNS(domain)" :disabled="generatingDNS === domain.name"
                            class="flex-1 bg-gray-100 dark:bg-slate-800 hover:bg-gray-200 dark:hover:bg-slate-700 text-gray-700 dark:text-slate-300 rounded-lg py-2.5 text-xs font-semibold transition-all border border-gray-200 dark:border-slate-700 disabled:opacity-50">
                        <span x-text="generatingDNS === domain.name ? 'Generating...' : 'Sync DNS Records'"></span>
                    </button>
                    <button @click="toggleDomain(domain)"
                            class="flex-1 rounded-lg py-2.5 text-xs font-semibold transition-all"
                            :class="domain.is_active ? 'bg-warning-500/10 text-warning-500 hover:bg-warning-500/20' : 'bg-success-500/10 text-success-500 hover:bg-success-500/20'">
                        <span x-text="domain.is_active ? 'Suspend' : 'Activate'"></span>
                    </button>
                    <button @click="deleteDomain(domain)" aria-label="Domain sil"
                            class="p-2.5 rounded-lg bg-danger-500/10 hover:bg-danger-500/20 text-danger-400 transition-all">
                        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                        </svg>
                    </button>
                </div>
            </div>
        </template>

        <template x-if="domains.length === 0 && !loading">
            <div class="col-span-full py-20 bg-white dark:bg-slate-900/50 border border-gray-200 dark:border-slate-800 rounded-2xl flex flex-col items-center justify-center text-center">
                <div class="w-16 h-16 bg-gray-100 dark:bg-slate-800 rounded-full flex items-center justify-center mb-4 text-gray-400">
                    <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0 3-4.03 3-9s-1.343-9-3-9m-9 9a9 9 0 019-9"/>
                    </svg>
                </div>
                <h3 class="text-gray-900 dark:text-white font-bold text-lg">No Domains Found</h3>
                <p class="text-gray-500 text-sm mt-1 mb-6">Start by adding your first mail domain.</p>
                <button @click="openAddModal()" class="bg-primary-600 hover:bg-primary-500 text-white px-6 py-2.5 rounded-xl font-medium transition-all shadow-lg shadow-primary-500/20">
                    Add Domain
                </button>
            </div>
        </template>

        <template x-if="loading">
            <div class="col-span-full py-20 flex items-center justify-center">
                <svg class="animate-spin h-8 w-8 text-primary-500" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </div>
        </template>
    </div>

    <!-- ADD DOMAIN MODAL -->
    <div x-show="showAddModal" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center p-4"
         @keydown.escape.window="showAddModal = false">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="showAddModal = false"></div>
        <div class="relative bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-2xl p-8 w-full max-w-md shadow-2xl" @click.stop>
            <h3 class="text-xl font-bold text-gray-900 dark:text-white mb-6">Add New Domain</h3>
            <form @submit.prevent="addDomain()">
                <div class="space-y-4">
                    <div>
                        <label for="new-domain-name" class="block text-sm font-medium text-gray-700 dark:text-slate-300 mb-2">Domain Name</label>
                        <input id="new-domain-name" type="text" x-model="newDomain.name"
                               placeholder="example.com" autocomplete="off" required
                               class="w-full bg-gray-50 dark:bg-slate-800 border border-gray-300 dark:border-slate-700 rounded-xl px-4 py-3 text-gray-900 dark:text-white placeholder-gray-400 focus:outline-none focus:border-primary-500 focus:ring-2 focus:ring-primary-500/20 transition-all">
                        <p class="text-xs text-gray-400 mt-1">Örn: jircode.com, firma.com.tr</p>
                    </div>
                    <div class="flex items-center gap-3">
                        <input id="domain-active" type="checkbox" x-model="newDomain.is_active"
                               class="w-4 h-4 text-primary-600 rounded border-gray-300 focus:ring-primary-500">
                        <label for="domain-active" class="text-sm text-gray-700 dark:text-slate-300">Activate immediately</label>
                    </div>
                    <div x-show="addError" role="alert"
                         class="bg-danger-500/10 border border-danger-500/30 rounded-xl p-3 text-danger-400 text-sm"
                         x-text="addError"></div>
                </div>
                <div class="flex gap-3 mt-6">
                    <button type="button" @click="showAddModal = false"
                            class="flex-1 px-4 py-3 bg-gray-100 dark:bg-slate-800 hover:bg-gray-200 dark:hover:bg-slate-700 text-gray-700 dark:text-slate-300 rounded-xl font-medium transition-all">
                        Cancel
                    </button>
                    <button type="submit" :disabled="adding"
                            class="flex-1 px-4 py-3 bg-primary-600 hover:bg-primary-500 disabled:opacity-60 text-white rounded-xl font-medium transition-all flex items-center justify-center gap-2">
                        <svg x-show="adding" class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                            <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                            <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                        </svg>
                        <span x-text="adding ? 'Adding...' : 'Add Domain'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- DNS RECORDS MODAL -->
    <div x-show="showDNSModal" x-cloak
         class="fixed inset-0 z-50 flex items-center justify-center p-4"
         @keydown.escape.window="showDNSModal = false">
        <div class="absolute inset-0 bg-black/60 backdrop-blur-sm" @click="showDNSModal = false"></div>
        <div class="relative bg-white dark:bg-slate-900 border border-gray-200 dark:border-slate-700 rounded-2xl p-8 w-full max-w-2xl shadow-2xl max-h-[90vh] overflow-y-auto" @click.stop>
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-bold text-gray-900 dark:text-white">
                    DNS Records - <span x-text="selectedDomain?.name" class="text-primary-500"></span>
                </h3>
                <button @click="showDNSModal = false" aria-label="Kapat"
                        class="p-2 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-lg text-gray-400 transition-colors">
                    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </button>
            </div>
            <template x-if="selectedDomain">
                <div class="space-y-4">
                    <div class="bg-gray-50 dark:bg-slate-800/50 rounded-xl p-4 border border-gray-200 dark:border-slate-700">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">SPF Record</span>
                            <span class="text-xs text-gray-400">TXT @ your-domain.com</span>
                        </div>
                        <code class="text-xs font-mono text-primary-500 dark:text-primary-400 break-all block"
                              x-text="selectedDomain.spf_record || 'Not generated yet'"></code>
                    </div>
                    <div class="bg-gray-50 dark:bg-slate-800/50 rounded-xl p-4 border border-gray-200 dark:border-slate-700">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">DKIM Record</span>
                            <span class="text-xs text-gray-400">TXT mail._domainkey</span>
                        </div>
                        <code class="text-xs font-mono text-primary-500 dark:text-primary-400 break-all block"
                              x-text="selectedDomain.dkim_record || 'Not generated yet'"></code>
                    </div>
                    <div class="bg-gray-50 dark:bg-slate-800/50 rounded-xl p-4 border border-gray-200 dark:border-slate-700">
                        <div class="flex items-center justify-between mb-2">
                            <span class="text-xs font-bold text-gray-500 uppercase tracking-widest">DMARC Record</span>
                            <span class="text-xs text-gray-400">TXT _dmarc</span>
                        </div>
                        <code class="text-xs font-mono text-primary-500 dark:text-primary-400 break-all block"
                              x-text="selectedDomain.dmarc_record || 'Not generated yet'"></code>
                    </div>
                    <div class="flex gap-3 pt-2">
                        <button @click="generateDNS(selectedDomain); showDNSModal = false"
                                class="flex-1 bg-primary-600 hover:bg-primary-500 text-white rounded-xl py-2.5 text-sm font-medium transition-all">
                            Generate / Regenerate DNS Keys
                        </button>
                        <button @click="verifyDomain(selectedDomain)"
                                class="flex-1 bg-success-500/10 hover:bg-success-500/20 text-success-500 rounded-xl py-2.5 text-sm font-medium transition-all">
                            Mark as Verified
                        </button>
                    </div>
                </div>
            </template>
        </div>
    </div>
</div>
