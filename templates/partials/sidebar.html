{% load static %}

<aside id="main-sidebar"
       :class="[
         sidebarOpen ? 'translate-x-0' : '-translate-x-full',
         sidebarCollapsed ? 'md:-translate-x-full md:w-0 md:max-w-0 md:border-r-0 md:overflow-hidden md:opacity-0 md:pointer-events-none' : 'md:translate-x-0 md:w-64 md:max-w-none md:opacity-100 md:pointer-events-auto'
       ]"
       class="fixed inset-y-0 left-0 z-50 w-[85vw] max-w-[300px]
              bg-slate-900 border-r border-slate-800 flex flex-col
              transform transition-all duration-300 ease-out
              md:relative md:flex shadow-2xl md:shadow-none shrink-0">

    <!-- Brand header -->
    <div class="h-14 px-4 sm:px-5 flex items-center justify-between border-b border-slate-800 shrink-0">
        <a href="{% url 'dashboard' %}" class="flex items-center gap-2.5 min-w-0">
            <img src="{% static 'brand/logo-icon.svg' %}" alt="JîrCode" class="w-9 h-9 rounded-xl shrink-0">
            <div class="min-w-0 leading-tight">
                <p class="jir-wordmark text-base text-white truncate">
                    Jîr<span class="jir-text-gradient">Code</span>
                </p>
                <p class="text-[10px] font-semibold uppercase tracking-[0.2em] text-emerald-400">Mail</p>
            </div>
        </a>
        <button @click="sidebarOpen = false"
                aria-label="Menüyü kapat"
                class="md:hidden icon-btn">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
            </svg>
        </button>
    </div>

    <!-- Navigation -->
    <nav class="flex-1 px-3 py-4 space-y-1 overflow-y-auto custom-scrollbar"
         aria-label="Ana navigasyon">

        <div class="px-3 pb-2">
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.15em]">Overview</span>
        </div>

        <a href="{% url 'dashboard' %}"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                  {% if current_page == 'dashboard' %}bg-primary-500/10 text-primary-300 border border-primary-500/20{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
            </svg>
            <span class="text-sm font-medium">Dashboard</span>
        </a>

        <div class="px-3 pt-6 pb-2">
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.15em]">Mail System</span>
        </div>

        <a href="{% url 'domains' %}"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                  {% if current_page == 'domains' %}bg-primary-500/10 text-primary-300 border border-primary-500/20{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 01-9 9m9-9a9 9 0 00-9-9m9 9H3m9 9a9 9 0 01-9-9m9 9c1.657 0 3-4.03 3-9s-1.343-9-3-9m0 18c-1.657 0 3-4.03 3-9s-1.343-9-3-9m-9 9a9 9 0 019-9"/>
            </svg>
            <span class="text-sm font-medium">Domains</span>
        </a>

        <a href="{% url 'accounts' %}"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                  {% if current_page == 'accounts' %}bg-primary-500/10 text-primary-300 border border-primary-500/20{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 20h5v-2a3 3 0 00-5.356-1.857M17 20H7m10 0v-2c0-.656-.126-1.283-.356-1.857M7 20H2v-2a3 3 0 015.356-1.857M7 20v-2c0-.656.126-1.283.356-1.857m0 0a5.002 5.002 0 019.288 0M15 7a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span class="text-sm font-medium">Accounts</span>
        </a>

        <a href="{% url 'webmail:inbox' %}"
           target="_blank"
           rel="noopener noreferrer"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span class="text-sm font-medium">Webmail</span>
            <svg class="w-3.5 h-3.5 ml-auto opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
        </a>

        <div class="px-3 pt-6 pb-2">
            <span class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.15em]">Management</span>
        </div>

        <a href="{% url 'containers' %}"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                  {% if current_page == 'containers' %}bg-primary-500/10 text-primary-300 border border-primary-500/20{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"/>
            </svg>
            <span class="text-sm font-medium">Docker</span>
        </a>

        <a href="{% url 'backups' %}"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                  {% if current_page == 'backups' %}bg-primary-500/10 text-primary-300 border border-primary-500/20{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4"/>
            </svg>
            <span class="text-sm font-medium">Backups</span>
        </a>

        <a href="{% url 'logs' %}"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                  {% if current_page == 'logs' %}bg-primary-500/10 text-primary-300 border border-primary-500/20{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
            </svg>
            <span class="text-sm font-medium">System Logs</span>
        </a>

        <a href="{% url 'repair' %}"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                  {% if current_page == 'repair' %}bg-primary-500/10 text-primary-300 border border-primary-500/20{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 4a2 2 0 114 0v1a1 1 0 001 1h3a1 1 0 011 1v3a1 1 0 01-1 1h-1a2 2 0 100 4h1a1 1 0 011 1v3a1 1 0 01-1 1h-3a1 1 0 01-1-1v-1a2 2 0 10-4 0v1a1 1 0 01-1 1H7a1 1 0 01-1-1v-3a1 1 0 00-1-1H4a2 2 0 110-4h1a1 1 0 001-1V7a1 1 0 011-1h3a1 1 0 001-1V4z"/>
            </svg>
            <span class="text-sm font-medium">Onarım</span>
        </a>

        <a href="{% url 'settings' %}"
           class="group flex items-center gap-3 px-3 py-2.5 rounded-xl transition-all
                  {% if current_page == 'settings' %}bg-primary-500/10 text-primary-300 border border-primary-500/20{% else %}text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent{% endif %}">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
            </svg>
            <span class="text-sm font-medium">Ayarlar</span>
        </a>
    </nav>

    <!-- Footer -->
    <div class="p-3 border-t border-slate-800 shrink-0">
        <form method="POST" action="{% url 'logout' %}">
            {% csrf_token %}
            <button type="submit"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl
                           text-slate-400 hover:bg-danger-500/10 hover:text-danger-400
                           border border-transparent hover:border-danger-500/20 transition-colors">
                <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
                <span class="text-sm font-medium">Çıkış Yap</span>
            </button>
        </form>
    </div>
</aside>
