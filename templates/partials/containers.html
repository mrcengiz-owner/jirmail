<!-- templates/partials/containers.html -->
<div class="p-8 fade-in htmx-fade" id="containers-content" x-data="containersApp()">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-white">Docker Engines</h2>
            <p class="text-slate-400 mt-1">Monitor and manage isolated containers</p>
        </div>
        <button @click="fetchContainers()" class="px-4 py-2.5 bg-white dark:bg-slate-800 hover:bg-gray-50 dark:hover:bg-slate-700 text-slate-300 rounded-xl text-sm font-medium flex items-center gap-2 border border-gray-200 dark:border-slate-700 shadow-sm transition-colors">
            <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
            </svg>
            Refresh
        </button>
    </div>

    <!-- Error State for Docker Socket -->
    <template x-if="containers.length > 0 && containers[0].container_id === 'error'">
        <div class="bg-danger-500/10 border border-danger-500/30 rounded-2xl p-6 text-center backdrop-blur-md mb-6">
            <svg class="h-16 w-16 mx-auto mb-4 text-danger-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z" />
            </svg>
            <h4 class="text-xl font-bold text-danger-400 mb-2">Permission Denied (Docker Socket)</h4>
            <p class="text-slate-300 mb-4" x-text="containers[0].error || 'Could not connect to Docker daemon.'"></p>
            <div class="inline-block text-sm text-slate-400 bg-white dark:bg-slate-900/50 rounded-xl p-4 text-left border border-gray-200 dark:border-slate-800">
                <p class="mb-2 font-medium text-slate-300">Troubleshooting Steps:</p>
                <ul class="list-disc list-inside space-y-1">
                    <li>Ensure Docker daemon is running on the host</li>
                    <li>Verify volume mount: <code class="text-primary-400 bg-gray-100 dark:bg-slate-950 px-1 rounded">/var/run/docker.sock:/var/run/docker.sock</code></li>
                    <li>Check if the container user has permissions to access the socket</li>
                </ul>
            </div>
        </div>
    </template>

    <template x-if="containers.length === 0">
        <div class="flex flex-col items-center justify-center py-20 text-slate-500 bg-white dark:bg-slate-900/50 border border-gray-200 dark:border-slate-800 rounded-2xl backdrop-blur-md">
            <svg class="h-16 w-16 mb-4 opacity-50" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
            </svg>
            <p>No containers found. Fetching data...</p>
        </div>
    </template>

    <template x-if="containers.length > 0 && containers[0].container_id !== 'error'">
        <div class="bento-grid" style="padding: 0;">
            <template x-for="c in containers" :key="c.container_id">
                <div class="bento-card bg-white dark:bg-slate-800/50 border border-gray-200 dark:border-slate-700">
                    <div class="flex items-center justify-between mb-6">
                        <div class="flex items-center gap-3">
                            <div class="w-12 h-12 rounded-xl flex items-center justify-center shadow-lg" :class="c.status === 'running' ? 'bg-success-500/10 text-success-400 shadow-success-500/20' : 'bg-danger-500/10 text-danger-400 shadow-danger-500/20'">
                                <svg class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 12h14M5 12a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v4a2 2 0 01-2 2M5 12a2 2 0 00-2 2v4a2 2 0 002 2h14a2 2 0 002-2v-4a2 2 0 00-2-2m-2-4h.01M17 16h.01" />
                                </svg>
                            </div>
                            <div>
                                <h4 class="text-white font-bold" x-text="c.container_name.replace('jir_', '').replace('_', ' ').toUpperCase()"></h4>
                                <!-- Status badge: running=success, stopped/exited=danger -->
                                <span class="px-2 py-0.5 rounded-full text-xs font-semibold border" :class="c.status === 'running' ? 'bg-success-500/10 text-success-400 border-success-500/20' : 'bg-danger-500/10 text-danger-400 border-danger-500/20'" x-text="c.status"></span>
                            </div>
                        </div>
                        <!-- Restart butonu -->
                        <button
                            @click="restartContainer(c.container_name)"
                            :disabled="restartingContainer === c.container_name"
                            :aria-label="'Yeniden başlat: ' + c.container_name"
                            class="p-2 rounded-lg transition-colors text-slate-400 hover:text-warning-400 hover:bg-warning-500/10 disabled:opacity-50 disabled:cursor-not-allowed"
                            title="Yeniden Başlat">
                            <svg class="h-5 w-5" :class="restartingContainer === c.container_name ? 'animate-spin' : ''" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                            </svg>
                        </button>
                    </div>
                    
                    <div class="space-y-4">
                        <div>
                            <div class="flex justify-between text-xs mb-1.5">
                                <span class="text-slate-400 font-medium">CPU Usage</span>
                                <span class="text-white font-semibold" x-text="(c.cpu_percent || 0).toFixed(1) + '%'"></span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" :class="(c.cpu_percent || 0) > 80 ? 'bg-danger-500' : (c.cpu_percent || 0) > 50 ? 'bg-warning-500' : 'bg-success-500'" :style="'width: ' + Math.min((c.cpu_percent || 0), 100) + '%'"></div>
                            </div>
                        </div>
                        <div>
                            <div class="flex justify-between text-xs mb-1.5">
                                <span class="text-slate-400 font-medium">Memory Usage</span>
                                <span class="text-white font-semibold" x-text="(c.ram_usage_mb || 0).toFixed(0) + ' MB / ' + (c.ram_limit_mb || 0).toFixed(0) + ' MB'"></span>
                            </div>
                            <div class="progress-bar-container">
                                <div class="progress-bar-fill" :class="(c.ram_percent || 0) > 80 ? 'bg-danger-500' : (c.ram_percent || 0) > 50 ? 'bg-warning-500' : 'bg-blue-500'" :style="'width: ' + Math.min((c.ram_percent || 0), 100) + '%'"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </template>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('containersApp', () => ({
            containers: [],
            restartingContainer: null,
            init() {
                this.fetchContainers();
                setInterval(() => this.fetchContainers(), 10000);
            },
            async fetchContainers() {
                try {
                    const res = await fetch('/api/management/container-status');
                    if (res.ok) this.containers = await res.json();
                } catch(e) { console.error(e); }
            },
            async restartContainer(containerName) {
                if (!confirm(`'${containerName}' container'ını yeniden başlatmak istediğinize emin misiniz?`)) return;
                this.restartingContainer = containerName;
                try {
                    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
                    const res = await fetch(`/api/management/restart-container/${containerName}`, {
                        method: 'POST',
                        headers: { 'X-CSRFToken': csrfToken, 'Content-Type': 'application/json' }
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        window.showToast(`'${containerName}' yeniden başlatıldı.`, 'success');
                        setTimeout(() => this.fetchContainers(), 3000);
                    } else {
                        window.showToast(data.message || 'Yeniden başlatma başarısız.', 'error');
                    }
                } catch(e) {
                    window.showToast('Bağlantı hatası.', 'error');
                } finally {
                    this.restartingContainer = null;
                }
            }
        }));
    });
</script>
