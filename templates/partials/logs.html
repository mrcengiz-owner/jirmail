<!-- templates/partials/logs.html -->
<div class="p-8 fade-in htmx-fade" id="logs-content" x-data="logsApp()">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">System Logs</h2>
            <p class="text-gray-500 dark:text-slate-400 mt-1">Real-time system events and application logs</p>
        </div>
        <div class="flex gap-3">
            <select x-model="logFilter" @change="fetchLogs()"
                    class="bg-white dark:bg-slate-800/50 border border-gray-200 dark:border-slate-700 rounded-xl px-4 py-2.5 text-sm text-gray-700 dark:text-slate-300 focus:ring-2 focus:ring-primary-500 focus:border-primary-500 outline-none transition-colors">
                <option value="">All Logs</option>
                <option value="error">Errors</option>
                <option value="warning">Warnings</option>
                <option value="info">Info</option>
            </select>
            <button @click="fetchLogs()"
                    class="px-4 py-2.5 bg-white dark:bg-slate-800 hover:bg-gray-50 dark:hover:bg-slate-700 text-gray-700 dark:text-slate-300 rounded-xl text-sm font-medium flex items-center gap-2 border border-gray-200 dark:border-slate-700 shadow-sm transition-colors">
                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
                Refresh
            </button>
        </div>
    </div>

    <!-- Loading state -->
    <template x-if="loading">
        <div class="flex items-center justify-center py-20 text-gray-400 dark:text-slate-500">
            <svg class="animate-spin h-8 w-8 mr-3 text-primary-500" fill="none" viewBox="0 0 24 24">
                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
            </svg>
            <span>Loading logs...</span>
        </div>
    </template>

    <!-- Error state -->
    <template x-if="!loading && error">
        <div class="bg-warning-500/10 border border-warning-500/30 rounded-2xl p-6 text-center mb-4">
            <svg class="h-10 w-10 mx-auto mb-3 text-warning-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <p class="text-warning-400 font-medium" x-text="error"></p>
            <p class="text-gray-500 dark:text-slate-500 text-sm mt-1">Mail servisleri henüz yapılandırılmamış olabilir.</p>
        </div>
    </template>

    <!-- Log list -->
    <template x-if="!loading">
        <div class="bg-white dark:bg-slate-800/50 border border-gray-200 dark:border-slate-700 rounded-2xl overflow-hidden backdrop-blur-md">
            <div class="h-[600px] overflow-y-auto custom-scrollbar font-mono text-sm">
                <template x-for="(log, index) in logs" :key="index">
                    <div class="px-6 py-3 border-b border-gray-100 dark:border-slate-800/50 hover:bg-gray-50 dark:hover:bg-slate-800/30 transition-colors flex gap-4">
                        <!-- Renk noktası -->
                        <div class="mt-1.5 shrink-0">
                            <span class="w-2.5 h-2.5 rounded-full inline-block" :class="{
                                'bg-danger-500':  log.type === 'error',
                                'bg-warning-500': log.type === 'warning',
                                'bg-blue-500':    log.type === 'info',
                                'bg-success-500': log.type === 'success' || log.type === 'auth',
                                'bg-slate-400':   !['error','warning','info','success','auth'].includes(log.type)
                            }"></span>
                        </div>
                        <div class="flex-1 min-w-0">
                            <div class="flex items-center gap-3 mb-1 flex-wrap">
                                <span class="text-xs text-gray-400 dark:text-slate-500" x-text="new Date(log.timestamp).toLocaleString('tr-TR')"></span>
                                <span class="text-xs font-semibold px-2 py-0.5 rounded bg-gray-100 dark:bg-slate-900 text-gray-600 dark:text-slate-400 uppercase" x-text="log.source"></span>
                                <span class="text-xs px-2 py-0.5 rounded font-medium" :class="{
                                    'bg-danger-500/10 text-danger-400':   log.type === 'error',
                                    'bg-warning-500/10 text-warning-400': log.type === 'warning',
                                    'bg-blue-500/10 text-blue-400':       log.type === 'info',
                                    'bg-success-500/10 text-success-400': log.type === 'success' || log.type === 'auth',
                                    'bg-slate-500/10 text-slate-400':     !['error','warning','info','success','auth'].includes(log.type)
                                }" x-text="log.type"></span>
                            </div>
                            <p class="text-gray-700 dark:text-slate-300 leading-relaxed break-all" x-text="log.message"></p>
                        </div>
                    </div>
                </template>

                <!-- Boş durum -->
                <template x-if="logs.length === 0 && !error">
                    <div class="flex flex-col items-center justify-center h-full py-20 text-gray-400 dark:text-slate-500">
                        <svg class="w-12 h-12 mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        <span>Seçilen kritere uygun log bulunamadı.</span>
                    </div>
                </template>
            </div>
        </div>
    </template>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('logsApp', () => ({
            logs: [],
            logFilter: '',
            loading: false,
            error: null,

            init() {
                this.fetchLogs();
            },

            async fetchLogs() {
                this.loading = true;
                this.error = null;
                try {
                    // JIR_KEY'i window objesinden al (master_panel view'u inject ediyor)
                    const key = window.JIR_KEY || '';
                    const params = new URLSearchParams({ lines: 100 });
                    if (key) params.append('key', key);
                    if (this.logFilter) params.append('filter_type', this.logFilter);

                    const res = await fetch(`/api/management/logs?${params.toString()}`);
                    if (!res.ok) {
                        this.error = `Sunucu hatası: ${res.status}`;
                        this.logs = [];
                        return;
                    }
                    const data = await res.json();
                    // API hata mesajı döndürdüyse (log dosyası yok vb.)
                    if (Array.isArray(data) && data.length > 0 && data[0].type === 'info' && data[0].source === 'system') {
                        this.error = data[0].message;
                        this.logs = [];
                    } else {
                        this.logs = Array.isArray(data) ? data : [];
                    }
                } catch(e) {
                    this.error = 'Bağlantı hatası: ' + e.message;
                    this.logs = [];
                } finally {
                    this.loading = false;
                }
            }
        }));
    });
</script>
