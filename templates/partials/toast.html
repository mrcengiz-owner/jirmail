<div x-data
     class="toast-container"
     aria-live="polite"
     aria-atomic="false"
     role="status">

    <template x-for="notification in $store.toast.notifications" :key="notification.id">
        <div
            x-show="notification.visible"
            x-transition:enter="transition ease-out duration-300"
            x-transition:enter-start="opacity-0 translate-y-4 scale-95"
            x-transition:enter-end="opacity-100 translate-y-0 scale-100"
            x-transition:leave="transition ease-in duration-200"
            x-transition:leave-start="opacity-100 translate-y-0 scale-100"
            x-transition:leave-end="opacity-0 translate-y-4 scale-95"
            class="toast"
            :class="{
                'toast-success': notification.type === 'success',
                'toast-error':   notification.type === 'error',
                'toast-warning': notification.type === 'warning',
                'toast-info':    notification.type === 'info'
            }"
            :role="notification.type === 'error' ? 'alert' : 'status'"
            :aria-live="notification.type === 'error' ? 'assertive' : 'polite'">

            <div class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center"
                 :class="{
                     'bg-primary-500/15': notification.type === 'success',
                     'bg-danger-500/15':  notification.type === 'error',
                     'bg-warning-500/15': notification.type === 'warning',
                     'bg-info-500/15':    notification.type === 'info'
                 }">
                <template x-if="notification.type === 'success'">
                    <svg class="w-5 h-5 text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 13l4 4L19 7"/>
                    </svg>
                </template>
                <template x-if="notification.type === 'error'">
                    <svg class="w-5 h-5 text-danger-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M6 18L18 6M6 6l12 12"/>
                    </svg>
                </template>
                <template x-if="notification.type === 'warning'">
                    <svg class="w-5 h-5 text-warning-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
                    </svg>
                </template>
                <template x-if="notification.type === 'info'">
                    <svg class="w-5 h-5 text-info-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
                    </svg>
                </template>
            </div>

            <div class="flex-1 min-w-0">
                <p class="text-sm font-medium text-white" x-text="notification.message"></p>
            </div>

            <button @click="$store.toast.remove(notification.id)"
                    class="shrink-0 icon-btn -mr-1"
                    aria-label="Bildirimi kapat">
                <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>
    </template>
</div>
