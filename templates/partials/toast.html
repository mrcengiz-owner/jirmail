<!-- templates/partials/toast.html -->
<!-- Toast bildirim konteyneri — sağ alt köşe, stacking destekli -->
<div 
  x-data
  class="fixed bottom-4 right-4 z-[9999] flex flex-col-reverse gap-2 pointer-events-none"
  aria-live="polite"
  aria-atomic="false"
  role="status">
  
  <template x-for="notification in $store.toast.notifications" :key="notification.id">
    <div
      x-show="notification.visible"
      x-transition:enter="transition ease-out duration-300"
      x-transition:enter-start="opacity-0 translate-y-4 scale-95"
      x-transition:enter-end="opacity-100 translate-y-0 scale-100"
      x-transition:leave="transition ease-in duration-200"
      x-transition:leave-start="opacity-100 translate-y-0 scale-100"
      x-transition:leave-end="opacity-0 translate-y-4 scale-95"
      class="pointer-events-auto flex items-center gap-3 px-4 py-3 rounded-xl shadow-2xl border min-w-[300px] max-w-[420px] backdrop-blur-xl"
      :class="{
        'bg-slate-900/95 border-primary-500/30 text-primary-400': notification.type === 'success',
        'bg-slate-900/95 border-danger-500/30 text-danger-400': notification.type === 'error',
        'bg-slate-900/95 border-warning-500/30 text-warning-400': notification.type === 'warning',
        'bg-slate-900/95 border-blue-500/30 text-blue-400': notification.type === 'info'
      }"
      :role="notification.type === 'error' ? 'alert' : 'status'"
      :aria-live="notification.type === 'error' ? 'assertive' : 'polite'">
      
      <!-- İkon -->
      <div class="shrink-0 w-8 h-8 rounded-lg flex items-center justify-center"
           :class="{
             'bg-primary-500/10': notification.type === 'success',
             'bg-danger-500/10': notification.type === 'error',
             'bg-warning-500/10': notification.type === 'warning',
             'bg-blue-500/10': notification.type === 'info'
           }">
        <!-- Success -->
        <template x-if="notification.type === 'success'">
          <svg class="w-5 h-5 text-primary-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"/>
          </svg>
        </template>
        <!-- Error -->
        <template x-if="notification.type === 'error'">
          <svg class="w-5 h-5 text-danger-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </template>
        <!-- Warning -->
        <template x-if="notification.type === 'warning'">
          <svg class="w-5 h-5 text-warning-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
          </svg>
        </template>
        <!-- Info -->
        <template x-if="notification.type === 'info'">
          <svg class="w-5 h-5 text-blue-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
          </svg>
        </template>
      </div>
      
      <!-- Mesaj -->
      <div class="flex-1 min-w-0">
        <p class="text-sm font-medium text-white truncate" x-text="notification.message"></p>
      </div>
      
      <!-- Kapat düğmesi -->
      <button 
        @click="$store.toast.remove(notification.id)"
        class="shrink-0 p-1 rounded-lg hover:bg-slate-700 transition-colors text-slate-400 hover:text-white"
        aria-label="Bildirimi kapat">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" aria-hidden="true">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
        </svg>
      </button>
    </div>
  </template>
</div>
