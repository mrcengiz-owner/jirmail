{% load static %}

<header class="h-14 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800/70
               flex items-center justify-between px-3 sm:px-4 lg:px-6 shrink-0 z-30 sticky top-0">

    <!-- Left: hamburger (mobile) + breadcrumb -->
    <div class="flex items-center gap-2 min-w-0">
        <button @click="sidebarOpen = !sidebarOpen"
                aria-label="Menüyü aç"
                class="md:hidden icon-btn -ml-1">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
            </svg>
        </button>

        <!-- Mobile brand fallback -->
        <a href="{% url 'dashboard' %}" class="flex items-center gap-2 md:hidden min-w-0">
            <img src="{% static 'brand/logo-icon.svg' %}" alt="JîrCode" class="w-7 h-7 rounded-lg shrink-0">
            <span class="jir-wordmark text-sm text-white truncate">
                Jîr<span class="jir-text-gradient">Code</span>
            </span>
        </a>

        <!-- Desktop: page metrics -->
        <div class="hidden md:flex items-center gap-3 lg:gap-5">
            <div class="chip">
                <span class="w-1.5 h-1.5 rounded-full bg-emerald-400 pulse-dot"></span>
                <span class="text-slate-400">Domain</span>
                <span class="text-emerald-300 tabular-nums font-semibold">{{ active_domains|default:"0" }}</span>
            </div>
            <div class="chip">
                <span class="text-slate-400">Hesap</span>
                <span class="text-emerald-300 tabular-nums font-semibold">{{ active_accounts|default:"0" }}</span>
            </div>
            <div class="chip hidden lg:inline-flex">
                <span class="text-slate-400">Pasif</span>
                <span class="text-amber-300 tabular-nums font-semibold">{{ inactive_accounts|default:"0" }}</span>
            </div>
        </div>
    </div>

    <!-- Right actions -->
    <div class="flex items-center gap-1.5">
        <a href="{% url 'webmail:inbox' %}"
           target="_blank"
           rel="noopener noreferrer"
           class="btn-webmail-nav hidden sm:inline-flex items-center gap-2.5 px-4 py-2 min-h-[40px] rounded-xl text-sm font-semibold text-white"
           aria-label="Webmail'i yeni sekmede aç">
            <svg class="w-5 h-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span>Webmail</span>
            <svg class="w-3.5 h-3.5 opacity-70" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
        </a>

        <button class="icon-btn" aria-label="Bildirimler">
            <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
            </svg>
        </button>

        <form method="POST" action="{% url 'logout' %}" class="hidden md:block">
            {% csrf_token %}
            <button type="submit"
                    aria-label="Çıkış yap"
                    class="icon-btn hover:text-danger-400 hover:bg-danger-500/10">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                </svg>
            </button>
        </form>
    </div>
</header>
