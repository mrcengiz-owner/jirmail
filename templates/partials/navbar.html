<!-- templates/partials/navbar.html -->
<div class="h-14 bg-slate-900/80 backdrop-blur-xl border-b border-slate-800/50 flex items-center justify-between px-4 shrink-0 z-40">

    <!-- Left: Compact Brand -->
    <div class="flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg bg-gradient-to-br from-emerald-500 to-emerald-700 flex items-center justify-center shadow-lg shadow-emerald-500/20">
            <svg class="h-4 w-4 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
        </div>
        <div class="hidden sm:block">
            <h1 class="text-sm font-bold text-white tracking-tight">Jîr-Mail</h1>
            <span class="text-[10px] text-emerald-400/80 font-medium">Command Center</span>
        </div>
    </div>

    <!-- Center: Static System Metrics (no polling) -->
    <div class="flex items-center gap-5">

        <!-- Aktif Domain Metriği -->
        <div class="hidden xs:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/40 border border-slate-700/30">
            <div class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></div>
            <span class="text-[11px] font-medium text-slate-400">Aktif Domain</span>
            <span class="text-sm font-bold text-emerald-400 tabular-nums">{{ active_domains|default:"0" }}</span>
        </div>

        <!-- Aktif Hesap Metriği -->
        <div class="hidden sm:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/40 border border-slate-700/30">
            <svg class="w-3.5 h-3.5 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="text-[11px] font-medium text-slate-400">Aktif Hesap</span>
            <span class="text-sm font-bold text-emerald-400 tabular-nums">{{ active_accounts|default:"0" }}</span>
        </div>

        <!-- Pasif Hesap Metriği -->
        <div class="hidden md:flex items-center gap-2 px-3 py-1.5 rounded-lg bg-slate-800/40 border border-slate-700/30">
            <svg class="w-3.5 h-3.5 text-amber-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"/>
            </svg>
            <span class="text-[11px] font-medium text-slate-400">Pasif Hesap</span>
            <span class="text-sm font-bold text-amber-400 tabular-nums">{{ inactive_accounts|default:"0" }}</span>
        </div>
    </div>

    <!-- Right: Action Buttons -->
    <div class="flex items-center gap-2">
        <!-- Refresh Button (plain link, no HTMX) -->
        <a href="{% url 'dashboard' %}"
           class="flex items-center gap-1.5 px-2.5 py-1.5 rounded-lg bg-slate-800/50 border border-slate-700/50 text-slate-400 hover:text-white hover:bg-slate-700/50 hover:border-slate-600/50 transition-all text-xs">
            <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
            </svg>
            <span class="hidden lg:inline">Yenile</span>
        </a>

        <!-- Webmail Button -->
        <a href="/mail-panel/"
           target="_blank"
           rel="noopener noreferrer"
           class="relative group flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-gradient-to-r from-emerald-500/10 via-emerald-400/10 to-emerald-500/10 border border-emerald-500/30 hover:border-emerald-400/60 hover:from-emerald-500/20 hover:via-emerald-400/20 hover:to-emerald-500/20 backdrop-blur-sm transition-all duration-300 hover:shadow-lg hover:shadow-emerald-500/10">
            <svg class="w-3.5 h-3.5 text-emerald-400 group-hover:text-emerald-300 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
            </svg>
            <span class="text-xs font-semibold text-emerald-400 group-hover:text-emerald-300 transition-colors">Webmail</span>
            <svg class="w-3 h-3 text-emerald-500/70 group-hover:text-emerald-400 transition-colors" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
            </svg>
        </a>
    </div>
</div>
