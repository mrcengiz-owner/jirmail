<!-- templates/partials/backup.html -->
<div class="p-8 fade-in htmx-fade" id="backup-content" x-data="backupApp()">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-gray-900 dark:text-white">System Backups</h2>
            <p class="text-gray-500 dark:text-slate-400 mt-1">Manage database and configuration backups</p>
        </div>
        <button @click="createBackup()"
                :disabled="creating"
                class="px-5 py-2.5 bg-primary-600 hover:bg-primary-500 disabled:opacity-60 disabled:cursor-not-allowed text-white rounded-xl text-sm font-medium flex items-center gap-2 shadow-lg shadow-primary-500/20 transition-all active:scale-95">
            <template x-if="creating">
                <svg class="animate-spin h-5 w-5" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                </svg>
            </template>
            <template x-if="!creating">
                <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
                </svg>
            </template>
            <span x-text="creating ? 'Creating...' : 'Create Backup'"></span>
        </button>
    </div>

    <!-- Hata mesajı -->
    <template x-if="error">
        <div class="mb-6 bg-danger-500/10 border border-danger-500/30 rounded-xl p-4 flex items-center gap-3">
            <svg class="h-5 w-5 text-danger-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
            <span class="text-danger-400 text-sm" x-text="error"></span>
        </div>
    </template>

    <div class="bg-white dark:bg-slate-800/50 border border-gray-200 dark:border-slate-700 rounded-2xl overflow-hidden backdrop-blur-md">
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-50 dark:bg-slate-800/50 border-b border-gray-200 dark:border-slate-700">
                <tr>
                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">Backup Name</th>
                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">Type</th>
                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">Size</th>
                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-4 text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">Date</th>
                    <th class="px-6 py-4 text-right text-xs font-semibold text-gray-500 dark:text-slate-400 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 dark:divide-slate-800/50">
                <template x-for="backup in backups" :key="backup.id">
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-800/30 transition-colors group">
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-blue-500/10 rounded-lg text-blue-400">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
                                    </svg>
                                </div>
                                <span class="text-sm font-medium text-gray-900 dark:text-white" x-text="backup.name"></span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500 dark:text-slate-400 capitalize" x-text="backup.backup_type"></td>
                        <td class="px-6 py-4 text-sm text-gray-500 dark:text-slate-400" x-text="backup.file_size_mb + ' MB'"></td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 rounded-full text-xs font-medium border" :class="{
                                'bg-success-500/10 text-success-400 border-success-500/20': backup.status === 'completed',
                                'bg-warning-500/10 text-warning-400 border-warning-500/20': backup.status === 'running' || backup.status === 'pending',
                                'bg-danger-500/10 text-danger-400 border-danger-500/20': backup.status === 'failed'
                            }" x-text="backup.status"></span>
                        </td>
                        <td class="px-6 py-4 text-sm text-gray-500 dark:text-slate-400"
                            x-text="new Date(backup.created_at).toLocaleDateString('tr-TR')"></td>
                        <td class="px-6 py-4 text-right">
                            <div class="flex items-center justify-end gap-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                <button @click="restoreBackup(backup)"
                                        :disabled="backup.status !== 'completed'"
                                        class="px-3 py-1.5 bg-blue-500/10 hover:bg-blue-600 text-blue-400 hover:text-white rounded-lg text-xs font-medium transition-colors disabled:opacity-40 disabled:cursor-not-allowed">
                                    Restore
                                </button>
                                <button @click="deleteBackup(backup)"
                                        class="px-3 py-1.5 bg-danger-500/10 hover:bg-danger-600 text-danger-400 hover:text-white rounded-lg text-xs font-medium transition-colors">
                                    Delete
                                </button>
                            </div>
                        </td>
                    </tr>
                </template>
                <template x-if="backups.length === 0 && !loading">
                    <tr>
                        <td colspan="6" class="px-6 py-16 text-center text-gray-400 dark:text-slate-500">
                            <svg class="w-12 h-12 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"/>
                            </svg>
                            Henüz yedek yok. Başlamak için "Create Backup" butonuna tıklayın.
                        </td>
                    </tr>
                </template>
                <template x-if="loading">
                    <tr>
                        <td colspan="6" class="px-6 py-16 text-center text-gray-400 dark:text-slate-500">
                            <svg class="animate-spin h-8 w-8 mx-auto text-primary-500" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                        </td>
                    </tr>
                </template>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('backupApp', () => ({
            backups: [],
            loading: false,
            creating: false,
            error: null,

            init() {
                this.fetchBackups();
            },

            async fetchBackups() {
                this.loading = true;
                try {
                    // Doğru endpoint: /api/backup/list-backups
                    const res = await fetch('/api/backup/list-backups');
                    if (res.ok) {
                        this.backups = await res.json();
                    } else {
                        console.error('Backup list error:', res.status);
                    }
                } catch(e) {
                    console.error('Backup fetch error:', e);
                } finally {
                    this.loading = false;
                }
            },

            async createBackup() {
                this.creating = true;
                this.error = null;
                window.showToast('Yedekleme başlatılıyor...', 'info');
                try {
                    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
                    // Doğru endpoint: /api/backup/create-backup
                    // API BackupConfigSchema bekliyor: backup_type, include_database, include_configs, include_emails
                    const res = await fetch('/api/backup/create-backup', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({
                            backup_type: 'full',
                            include_database: true,
                            include_configs: true,
                            include_emails: false
                        })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        window.showToast('Yedekleme başarıyla oluşturuldu!', 'success');
                        await this.fetchBackups();
                    } else {
                        this.error = data.message || 'Yedekleme başarısız.';
                        window.showToast(this.error, 'error');
                    }
                } catch(e) {
                    this.error = 'Bağlantı hatası: ' + e.message;
                    window.showToast(this.error, 'error');
                } finally {
                    this.creating = false;
                }
            },

            async restoreBackup(backup) {
                if (!confirm(`"${backup.name}" yedeğinden geri yüklemek istediğinize emin misiniz? Mevcut veriler üzerine yazılacak.`)) return;
                window.showToast('Geri yükleme başlatılıyor...', 'info');
                try {
                    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
                    const res = await fetch('/api/backup/restore-backup', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'X-CSRFToken': csrfToken
                        },
                        body: JSON.stringify({
                            backup_id: backup.id,
                            restore_database: true,
                            restore_configs: true,
                            restore_emails: false
                        })
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        window.showToast('Geri yükleme tamamlandı!', 'success');
                    } else {
                        window.showToast(data.message || 'Geri yükleme başarısız.', 'error');
                    }
                } catch(e) {
                    window.showToast('Bağlantı hatası.', 'error');
                }
            },

            async deleteBackup(backup) {
                if (!confirm(`"${backup.name}" yedeğini silmek istediğinize emin misiniz?`)) return;
                try {
                    const csrfToken = document.querySelector('meta[name="csrf-token"]')?.content || '';
                    const res = await fetch(`/api/backup/delete-backup/${backup.id}`, {
                        method: 'DELETE',
                        headers: { 'X-CSRFToken': csrfToken }
                    });
                    const data = await res.json();
                    if (data.status === 'success') {
                        window.showToast('Yedek silindi.', 'success');
                        await this.fetchBackups();
                    } else {
                        window.showToast(data.message || 'Silme başarısız.', 'error');
                    }
                } catch(e) {
                    window.showToast('Bağlantı hatası.', 'error');
                }
            }
        }));
    });
</script>
