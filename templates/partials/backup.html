<!-- templates/partials/backup.html -->
<div class="p-8 fade-in htmx-fade" id="backup-content" x-data="backupApp()">
    <div class="flex items-center justify-between mb-8">
        <div>
            <h2 class="text-3xl font-bold tracking-tight text-white">System Backups</h2>
            <p class="text-slate-400 mt-1">Manage database and configuration backups</p>
        </div>
        <button @click="createBackup()" class="px-5 py-2.5 bg-primary-600 hover:bg-primary-500 text-white rounded-xl text-sm font-medium flex items-center gap-2 shadow-lg shadow-primary-500/20 transition-all active:scale-95">
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7h12m0 0l-4-4m4 4l-4 4m0 6H4m0 0l4 4m-4-4l4-4" />
            </svg>
            Create Backup
        </button>
    </div>

    <div class="bg-white dark:bg-slate-800/50 border border-gray-200 dark:border-slate-700 rounded-2xl overflow-hidden backdrop-blur-md">
        <table class="w-full text-left border-collapse">
            <thead class="bg-gray-50 dark:bg-slate-800/50 border-b border-gray-200 dark:border-slate-700">
                <tr>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Backup Name</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Type</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Size</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Status</th>
                    <th class="px-6 py-4 text-xs font-semibold text-slate-400 uppercase tracking-wider">Date</th>
                    <th class="px-6 py-4 text-right text-xs font-semibold text-slate-400 uppercase tracking-wider">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-gray-100 dark:divide-slate-800/50">
                <template x-for="backup in backups" :key="backup.id">
                    <tr class="hover:bg-gray-50 dark:hover:bg-slate-800/30 transition-colors group">
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                                <div class="p-2 bg-blue-500/10 rounded-lg text-blue-400">
                                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                                </div>
                                <span class="text-sm font-medium text-white" x-text="backup.name"></span>
                            </div>
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-400" x-text="backup.backup_type"></td>
                        <td class="px-6 py-4 text-sm text-slate-400" x-text="backup.file_size_mb + ' MB'"></td>
                        <td class="px-6 py-4">
                            <span class="px-3 py-1 rounded-full text-xs font-medium border" :class="{
                                'bg-success-500/10 text-success-400 border-success-500/20': backup.status === 'completed',
                                'bg-warning-500/10 text-warning-400 border-warning-500/20': backup.status === 'running',
                                'bg-danger-500/10 text-danger-400 border-danger-500/20': backup.status === 'failed'
                            }" x-text="backup.status"></span>
                        </td>
                        <td class="px-6 py-4 text-sm text-slate-400" x-text="new Date(backup.created_at).toLocaleDateString()"></td>
                        <td class="px-6 py-4 text-right">
                            <button @click="restoreBackup(backup)" class="px-3 py-1.5 bg-gray-100 dark:bg-slate-800 hover:bg-blue-600 text-slate-300 hover:text-white rounded-lg text-xs font-medium transition-colors opacity-0 group-hover:opacity-100">
                                Restore
                            </button>
                        </td>
                    </tr>
                </template>
                <template x-if="backups.length === 0">
                    <tr><td colspan="6" class="px-6 py-16 text-center text-slate-500">
                        <svg class="w-12 h-12 mx-auto mb-4 opacity-50" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M5 8h14M5 8a2 2 0 110-4h14a2 2 0 110 4M5 8v10a2 2 0 002 2h10a2 2 0 002-2V8m-9 4h4"></path></svg>
                        No backups available. Create one to get started.
                    </td></tr>
                </template>
            </tbody>
        </table>
    </div>
</div>

<script>
    document.addEventListener('alpine:init', () => {
        Alpine.data('backupApp', () => ({
            backups: [],
            init() {
                this.fetchBackups();
            },
            async fetchBackups() {
                try {
                    const res = await fetch('/api/backup/list');
                    if(res.ok) this.backups = await res.json();
                } catch(e) { console.error(e); }
            },
            async createBackup() {
                window.showToast("Creating backup...", "info");
                try {
                    const res = await fetch('/api/backup/create', { method: 'POST', headers: {'X-CSRFToken': document.querySelector('meta[name="csrf-token"]').content} });
                    if(res.ok) {
                        window.showToast("Backup created successfully!", "success");
                        this.fetchBackups();
                    } else {
                        window.showToast("Failed to create backup", "error");
                    }
                } catch(e) { window.showToast("Error creating backup", "error"); }
            }
        }));
    });
</script>
