{% extends "webmail/layouts/shell.html" %}
{% load static %}

{% block title %}Gelen Kutusu — Jîr-Mail{% endblock %}

{% block wm_body %}
<div class="wm-proton flex h-dvh w-full overflow-hidden bg-slate-950"
     x-data="mailApp()"
     x-init="init()"
     data-user-email="{{ email|default:''|escape }}"
     data-ai-enabled="{{ ai_enabled|yesno:'true,false' }}"
     data-is-admin="{{ is_admin|yesno:'true,false' }}">

  <div class="fixed inset-0 z-40 bg-black/60 lg:hidden"
       x-show="sidebarOpen" x-cloak @click="sidebarOpen = false"></div>

  <!-- Sol menü -->
  <aside class="fixed lg:static inset-y-0 left-0 z-50 w-[220px] flex flex-col bg-slate-900 border-r border-slate-800 shrink-0 transition-transform duration-200"
         :class="sidebarOpen ? 'translate-x-0' : '-translate-x-full lg:translate-x-0'">
    <div class="h-12 px-3 flex items-center gap-2 border-b border-slate-800 shrink-0">
      <img src="{% static 'brand/logo-icon.svg' %}" alt="" class="w-7 h-7 rounded-lg">
      <span class="text-sm font-bold text-white">Jîr<span class="text-primary-400">Mail</span></span>
    </div>

    <div class="p-2 shrink-0">
      <button type="button" @click="openCompose()" class="btn btn-primary w-full text-sm py-2 gap-2">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M12 4v16m8-8H4"/></svg>
        Yeni mesaj
      </button>
    </div>

    <nav class="flex-1 overflow-y-auto px-2 py-1 space-y-0.5 text-sm" aria-label="Klasörler">
      <template x-for="f in folderNav" :key="f.id">
        <button type="button" @click="setFolder(f.id)"
                class="w-full flex items-center gap-2.5 px-2.5 py-2 rounded-lg font-medium transition-colors border"
                :class="currentFolder === f.id
                  ? 'bg-primary-500/10 text-primary-300 border-primary-500/25'
                  : 'text-slate-400 hover:bg-slate-800/80 hover:text-white border-transparent'">
          <span x-html="f.icon" class="w-5 h-5 shrink-0 opacity-80"></span>
          <span class="truncate" x-text="f.label"></span>
          <span x-show="f.id === 'inbox' && unreadCount > 0"
                class="ml-auto text-[10px] font-bold tabular-nums bg-primary-500/20 text-primary-300 px-1.5 py-0.5 rounded-full"
                x-text="unreadCount"></span>
        </button>
      </template>
    </nav>

    <div class="p-3 border-t border-slate-800 shrink-0 space-y-2">
      <div x-show="quota" class="text-[10px] text-slate-500">
        <div class="flex justify-between mb-1">
          <span>Depolama</span>
          <span x-text="quotaLabel()"></span>
        </div>
        <div class="wm-quota-bar">
          <div class="wm-quota-bar__fill" :style="'width:' + Math.min(100, quota.percent || 0) + '%'"></div>
        </div>
      </div>
      <div class="flex items-center gap-2 min-w-0">
        <div class="w-8 h-8 rounded-full flex items-center justify-center text-xs font-bold text-white shrink-0"
             :style="'background:' + avatarColor(userEmail)" x-text="initials(userEmail)"></div>
        <span class="text-xs text-slate-400 truncate flex-1" x-text="userEmail"></span>
      </div>
      <div class="flex gap-1">
        <a href="{% url 'webmail:settings' %}" class="btn btn-ghost btn-sm flex-1 text-xs">Ayarlar</a>
        <form method="post" action="{% url 'webmail:logout' %}" class="flex-1">
          {% csrf_token %}
          <button type="submit" class="btn btn-ghost btn-sm w-full text-xs text-danger-400">Çıkış</button>
        </form>
      </div>
    </div>
  </aside>

  <!-- Ana alan -->
  <div class="flex flex-1 flex-col min-w-0 min-h-0">
    <!-- Üst arama -->
    <header class="h-12 flex items-center gap-2 px-3 border-b border-slate-800 bg-slate-900/80 shrink-0">
      <button type="button" class="lg:hidden p-2 rounded-lg text-slate-400 hover:bg-slate-800" @click="sidebarOpen = true" aria-label="Menü">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/></svg>
      </button>
      <div class="relative flex-1 max-w-xl">
        <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-slate-500 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z"/></svg>
        <input type="search" class="input input-sm w-full pl-9" placeholder="Konu, gönderen veya içerikte ara…"
               x-model.debounce.350ms="searchQuery" @input="onSearch()">
      </div>
      <button type="button" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800" :class="syncing && 'animate-spin'" @click="syncNow()" title="Senkronize">
        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.023 9.348h4.992v-.001M2.985 19.644v-4.992m0 0h4.992m-4.993 0l3.181 3.183a8.25 8.25 0 0013.803-3.7M4.031 9.865a8.25 8.25 0 0113.803-3.7l3.181 3.182m0-4.991v4.99"/></svg>
      </button>
    </header>

    <div class="flex flex-1 min-h-0">
      <!-- Liste -->
      <section class="wm-col-list w-full lg:w-[300px] xl:w-[320px] flex flex-col border-r border-slate-800 bg-slate-900/40 shrink-0"
               :class="mobileView !== 'list' && 'is-hidden lg:flex'">
        <div class="px-2 py-2 border-b border-slate-800 flex flex-wrap items-center gap-1 shrink-0">
          <h2 class="text-sm font-semibold text-white flex-1 min-w-0 truncate px-1" x-text="folderTitle()"></h2>
          <label class="flex items-center gap-1.5 text-[11px] text-slate-500 px-1 cursor-pointer">
            <input type="checkbox" class="rounded border-slate-600" :checked="allSelected" @change="toggleSelectAll($event.target.checked)">
            Tümü
          </label>
          <button type="button" class="text-[11px] px-2 py-1 rounded-md text-slate-400 hover:bg-slate-800" @click="bulkAction('seen')" :disabled="!hasSelection">Okundu</button>
          <button type="button" class="text-[11px] px-2 py-1 rounded-md text-slate-400 hover:bg-slate-800 hover:text-danger-400" @click="bulkAction('delete')" :disabled="!hasSelection">Sil</button>
        </div>

        <div class="flex-1 overflow-y-auto custom-scrollbar">
          <p x-show="loadingMails" class="p-4 text-center text-sm text-slate-500">Yükleniyor…</p>
          <template x-for="mail in mails" :key="mail.uid + '-' + currentFolder">
            <article @click="selectMail(mail)"
                     class="flex gap-2 px-2 py-2.5 border-b border-slate-800/50 cursor-pointer transition-colors relative"
                     :class="{
                       'bg-primary-500/10 border-l-2 border-l-primary-500': selectedMail && selectedMail.uid === mail.uid,
                       'hover:bg-slate-800/50': !(selectedMail && selectedMail.uid === mail.uid)
                     }">
              <input type="checkbox" class="mt-1 rounded border-slate-600 shrink-0"
                     :checked="isSelected(mail.uid)" @click.stop="toggleSelect(mail.uid)">
              <div class="w-8 h-8 rounded-full flex items-center justify-center text-[10px] font-bold text-white shrink-0"
                   :style="'background:' + avatarColor(mail.from)" x-text="initials(mail.from)"></div>
              <div class="flex-1 min-w-0">
                <div class="flex items-baseline justify-between gap-1">
                  <span class="text-xs truncate" :class="mail.unread ? 'font-semibold text-white' : 'text-slate-400'" x-text="displayFrom(mail)"></span>
                  <time class="text-[10px] text-slate-500 shrink-0 tabular-nums" x-text="formatDate(mail.date)"></time>
                </div>
                <p class="text-xs truncate mt-0.5" :class="mail.unread ? 'text-slate-200 font-medium' : 'text-slate-500'" x-text="mail.subject"></p>
                <p class="text-[11px] text-slate-600 truncate" x-text="mail.preview"></p>
              </div>
              <span x-show="mail.unread" class="w-2 h-2 rounded-full bg-primary-500 shrink-0 self-center"></span>
            </article>
          </template>
          <div x-show="!loadingMails && mails.length === 0" class="p-8 text-center text-sm text-slate-500" x-text="emptyFolderMessage()"></div>
        </div>
      </section>

      <!-- Okuma -->
      <section class="wm-col-read flex-1 flex flex-col min-w-0 bg-slate-950"
               :class="mobileView === 'list' && 'is-hidden lg:flex'">
        <template x-if="selectedMail && !composeOpen">
          <div class="flex flex-col h-full min-h-0">
            <div class="px-4 py-3 border-b border-slate-800 flex items-start gap-2 shrink-0">
              <button type="button" class="lg:hidden p-2 -ml-2 rounded-lg text-slate-400" @click="goBack()">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
              </button>
              <div class="flex-1 min-w-0">
                <h1 class="text-base font-semibold text-white leading-snug break-words" x-text="selectedMail.subject"></h1>
              </div>
              <div class="flex gap-0.5 shrink-0">
                <button type="button" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800" @click="toggleStar(selectedMail)" :class="selectedMail.starred && 'text-amber-400'">
                  <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 24 24"><path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/></svg>
                </button>
                <button type="button" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800 hover:text-danger-400" @click="deleteMail(selectedMail)">
                  <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
                </button>
                <button type="button" class="p-2 rounded-lg text-slate-400 hover:bg-slate-800" @click="replyTo()">↩</button>
              </div>
            </div>
            <div class="px-4 py-2 flex items-center gap-3 border-b border-slate-800/80 shrink-0">
              <div class="w-9 h-9 rounded-full flex items-center justify-center text-xs font-bold text-white"
                   :style="'background:' + avatarColor(selectedMail.from)" x-text="initials(selectedMail.from)"></div>
              <div class="min-w-0 flex-1">
                <div class="text-sm font-medium text-white truncate" x-text="displayFrom(selectedMail)"></div>
                <div class="text-xs text-slate-500" x-text="formatDate(selectedMail.date)"></div>
              </div>
            </div>
            <div x-show="selectedMail.attachments && selectedMail.attachments.length" class="px-4 py-2 flex flex-wrap gap-2 border-b border-slate-800 shrink-0">
              <template x-for="(att, i) in (selectedMail.attachments || [])" :key="i">
                <span class="text-[11px] px-2 py-1 rounded-md bg-slate-800 text-slate-300 border border-slate-700"
                      x-text="att.filename + ' (' + formatSize(att.size) + ')'"></span>
              </template>
            </div>
            <div class="flex-1 overflow-y-auto custom-scrollbar p-4 wm-mail-body prose prose-invert max-w-none"
                 x-html="sanitizeHtml(selectedMail.body || '<p class=\'text-slate-500\'>İçerik yükleniyor…</p>')"></div>
          </div>
        </template>

        <div x-show="!selectedMail && !composeOpen" class="flex-1 flex flex-col items-center justify-center p-8 text-center text-slate-500">
          <div class="w-16 h-16 rounded-full bg-slate-900 border border-slate-800 flex items-center justify-center mb-4">
            <svg class="w-8 h-8 text-slate-600" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M21.75 6.75v10.5a2.25 2.25 0 01-2.25 2.25h-15a2.25 2.25 0 01-2.25-2.25V6.75"/></svg>
          </div>
          <p class="text-sm font-medium">Mesaj seçin veya yeni mail yazın</p>
          <button type="button" @click="openCompose()" class="btn btn-primary btn-sm mt-4">Yeni mesaj</button>
        </div>
      </section>
    </div>
  </div>

  <!-- Compose modal (sağ alt) -->
  <div x-show="composeOpen" x-cloak
       class="wm-compose-modal fixed z-[60] bottom-0 right-0 lg:right-6 w-full max-w-lg bg-slate-900 border border-slate-700 rounded-t-xl lg:rounded-xl overflow-hidden flex flex-col"
       :class="composeMinimized ? 'h-12' : 'h-[min(520px,85vh)]'"
       @keydown.escape.window="closeCompose()">
    <header class="h-11 px-3 flex items-center gap-2 bg-slate-800/90 border-b border-slate-700 shrink-0 cursor-pointer" @click="composeMinimized = !composeMinimized">
      <span class="text-sm font-semibold text-white flex-1 truncate" x-text="composeSubject || 'Yeni mesaj'"></span>
      <span x-show="draftSaving" class="text-[10px] text-slate-500">Taslak…</span>
      <span x-show="draftSavedAt" class="text-[10px] text-emerald-500/80" x-text="'Kaydedildi ' + draftSavedAt"></span>
      <button type="button" class="p-1.5 rounded text-slate-400 hover:bg-slate-700" @click.stop="composeMinimized = !composeMinimized" aria-label="Küçült">—</button>
      <button type="button" class="p-1.5 rounded text-slate-400 hover:bg-slate-700" @click.stop="closeCompose()" aria-label="Kapat">✕</button>
    </header>
    <div x-show="!composeMinimized" class="flex flex-col flex-1 min-h-0 overflow-hidden">
      <div class="px-3 py-2 space-y-2 border-b border-slate-800 shrink-0 text-sm">
        <div class="flex items-center gap-2">
          <label class="text-slate-500 w-10 shrink-0 text-xs">Kime</label>
          <input type="email" class="input input-sm flex-1" x-model="composeTo" placeholder="ornek@domain.com">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-slate-500 w-10 shrink-0 text-xs">Cc</label>
          <input type="email" class="input input-sm flex-1" x-model="composeCc" placeholder="isteğe bağlı">
        </div>
        <div class="flex items-center gap-2">
          <label class="text-slate-500 w-10 shrink-0 text-xs">Konu</label>
          <input type="text" class="input input-sm flex-1" x-model="composeSubject">
        </div>
      </div>
      <div class="flex-1 min-h-0 px-3 py-2 wm-compose-editor overflow-hidden flex flex-col">
        <div id="wm-quill-editor" class="flex-1 min-h-0"></div>
      </div>
      <footer class="px-3 py-2 border-t border-slate-800 flex flex-wrap items-center gap-2 shrink-0">
        <input type="file" multiple class="text-xs text-slate-500 max-w-[140px]" @change="onFiles($event)">
        <span class="flex-1"></span>
        <button type="button" class="btn btn-ghost btn-sm" @click="saveDraft(true)">Taslağa kaydet</button>
        <button type="button" class="btn btn-secondary btn-sm" @click="closeCompose()">İptal</button>
        <button type="button" class="btn btn-primary btn-sm" @click="sendMail()" :disabled="sendingMail">
          <span x-text="sendingMail ? 'Gönderiliyor…' : 'Gönder'"></span>
        </button>
      </footer>
    </div>
  </div>
</div>
{% endblock %}
