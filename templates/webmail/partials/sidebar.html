<aside class="wm-sidebar"
       :class="{ 'is-open': sidebarOpen }">
  <div class="wm-sidebar__brand">
    <img src="{% url 'webmail:asset' asset_path='brand/logo-icon.svg' %}" alt="Jîr-Mail" class="wm-sidebar__logo">
    <span class="wm-sidebar__title">Jîr<span>Mail</span></span>
  </div>

  <button type="button" class="wm-compose-btn" @click="openCompose(); sidebarOpen = false">
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 16.07a4.5 4.5 0 01-1.897 1.13L6 18l.8-2.685a4.5 4.5 0 011.13-1.897l8.932-8.931zm0 0L19.5 7.125M18 14v4.75A2.25 2.25 0 0115.75 21H5.25A2.25 2.25 0 013 18.75V8.25A2.25 2.25 0 015.25 6H10"/></svg>
    Yeni mesaj
  </button>

  <nav class="wm-nav" aria-label="Klasörler">
    <p class="wm-nav__label">Klasörler</p>
    <button type="button" class="wm-folder" :class="currentFolder === 'inbox' && 'is-active'"
            @click="setFolder('inbox')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 13.5h3.86a2.25 2.25 0 012.012 1.244l.256.512a2.25 2.25 0 002.013 1.244h3.218a2.25 2.25 0 002.013-1.244l.256-.512a2.25 2.25 0 012.013-1.244h3.859M12 3v10.5m0 0l-3.75-3.75M12 13.5l3.75-3.75"/></svg>
      Gelen kutusu
      <span class="wm-folder__badge" x-show="unreadCount > 0 && currentFolder === 'inbox'" x-text="unreadCount"></span>
    </button>
    <button type="button" class="wm-folder" :class="currentFolder === 'sent' && 'is-active'"
            @click="setFolder('sent')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M6 12L3.269 3.126A59.768 59.768 0 0121.485 12 59.77 59.77 0 013.27 20.876L5.999 12zm0 0h7.5"/></svg>
      Gönderilen
    </button>
    <button type="button" class="wm-folder" :class="currentFolder === 'drafts' && 'is-active'"
            @click="setFolder('drafts')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"/></svg>
      Taslaklar
    </button>
    <button type="button" class="wm-folder" :class="currentFolder === 'starred' && 'is-active'"
            @click="setFolder('starred')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>
      Yıldızlı
    </button>
    <button type="button" class="wm-folder" :class="currentFolder === 'trash' && 'is-active'"
            @click="setFolder('trash')">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
      Çöp kutusu
    </button>
  </nav>

  <div class="wm-sidebar__footer">
    <div class="wm-user" x-show="userEmail">
      <div class="wm-user__avatar" :style="'background:' + avatarColor(userEmail)" x-text="initials(userEmail)"></div>
      <span class="wm-user__email" x-text="userEmail"></span>
    </div>
    <div class="wm-sidebar-actions">
      <button type="button" class="wm-btn-ghost" x-show="aiEnabled" @click="openAi()">AI</button>
      <form method="post" action="{% url 'webmail:logout' %}" class="wm-flex-1">
        {% csrf_token %}
        <button type="submit" class="wm-btn-ghost wm-btn-ghost--danger wm-w-full">Çıkış</button>
      </form>
    </div>
  </div>
</aside>
