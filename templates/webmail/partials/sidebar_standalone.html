{# Ayarlar — MailFlow yan menü #}
<aside class="wm-settings-sidebar"
       :class="sidebarOpen ? 'is-open' : ''"
       aria-label="Ana menü">
  <a href="{% url 'webmail:inbox' %}" class="wm-settings-sidebar__brand">
    <div class="wm-settings-sidebar__logo" aria-hidden="true">
      <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">mail</span>
    </div>
    <div class="min-w-0">
      <p class="wm-settings-sidebar__title">Jîr-Mail</p>
      <p class="wm-settings-sidebar__sub">Webmail</p>
    </div>
  </a>

  <a href="{% url 'webmail:inbox' %}" class="wm-settings-sidebar__compose">
    <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">edit</span>
    Yeni mesaj
  </a>

  <nav class="wm-settings-sidebar__nav">
    <a href="{% url 'webmail:inbox' %}" class="wm-settings-sidebar__link">
      <span class="material-symbols-outlined text-[20px]">inbox</span>
      Gelen kutusu
    </a>
    <a href="{% url 'webmail:inbox' %}?folder=sent" class="wm-settings-sidebar__link">
      <span class="material-symbols-outlined text-[20px]">send</span>
      Gönderilen
    </a>
    <a href="{% url 'webmail:inbox' %}?folder=drafts" class="wm-settings-sidebar__link">
      <span class="material-symbols-outlined text-[20px]">draft</span>
      Taslaklar
    </a>
    <a href="{% url 'webmail:settings' %}" class="wm-settings-sidebar__link is-active">
      <span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 1;">settings</span>
      Ayarlar
    </a>
  </nav>

  <div class="wm-settings-sidebar__footer">
    <div class="wm-settings-sidebar__user" x-show="userEmail">
      <div class="wm-settings-sidebar__avatar"
           :style="'background:' + avatarColor(userEmail)"
           x-text="initials(userEmail)"></div>
      <span class="wm-settings-sidebar__email" x-text="userEmail"></span>
    </div>
    <form method="post" action="{% url 'webmail:logout' %}">
      {% csrf_token %}
      <button type="submit" class="wm-settings-sidebar__logout">Çıkış</button>
    </form>
  </div>
</aside>
