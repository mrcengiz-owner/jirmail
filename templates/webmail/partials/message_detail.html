<header class="wm-message-header">
  <div class="wm-message-header__toolbar">
    <button type="button" class="wm-icon-btn wm-hide-desktop" @click="goBack()" aria-label="Geri">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5L8.25 12l7.5-7.5"/></svg>
    </button>
    <button type="button" class="wm-icon-btn" @click="toggleStar(selectedMail)" :title="selectedMail?.starred ? 'Yıldızı kaldır' : 'Yıldızla'">
      <svg fill="none" viewBox="0 0 24 24" :stroke="selectedMail?.starred ? '#f5c451' : 'currentColor'" :fill="selectedMail?.starred ? '#f5c451' : 'none'" stroke-width="1.75"><path stroke-linecap="round" stroke-linejoin="round" d="M11.48 3.499a.562.562 0 011.04 0l2.125 5.111a.563.563 0 00.475.345l5.518.442c.499.04.701.663.321.988l-4.204 3.602a.563.563 0 00-.182.557l1.285 5.385a.562.562 0 01-.84.61l-4.725-2.885a.563.563 0 00-.586 0L6.982 20.54a.562.562 0 01-.84-.61l1.285-5.386a.562.562 0 00-.182-.557l-4.204-3.602a.563.563 0 01.321-.988l5.518-.442a.563.563 0 00.475-.345L11.48 3.5z"/></svg>
    </button>
    <button type="button" class="wm-icon-btn" @click="replyTo()" title="Yanıtla">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9 15L3 9m0 0l6-6M3 9h12a6 6 0 010 12h-3"/></svg>
    </button>
    <button type="button" class="wm-icon-btn" @click="deleteMail(selectedMail)" title="Sil">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>
    </button>
    <span class="wm-flex-1"></span>
    <button type="button" class="wm-icon-btn" x-show="aiEnabled" @click="openAi()" title="AI Asistan">
      <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M9.813 15.904L9 18.75l-.813-2.846a4.5 4.5 0 00-3.09-3.09L2.25 12l2.846-.813a4.5 4.5 0 003.09-3.09L9 5.25l.813 2.846a4.5 4.5 0 003.09 3.09L15.75 12l-2.846.813a4.5 4.5 0 00-3.09 3.09z"/></svg>
    </button>
  </div>

  <div class="wm-sender-alert" x-show="selectedMail?.is_spoofed || selectedMail?.is_probable_scam" x-cloak>
    <svg fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" class="wm-sender-alert__icon"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z"/></svg>
    <div>
      <strong x-show="selectedMail?.is_spoofed">Sahte gönderen uyarısı</strong>
      <strong x-show="!selectedMail?.is_spoofed && selectedMail?.is_probable_scam">Şüpheli içerik</strong>
      <p x-text="selectedMail?.sender_warning || 'Bu iletiye dikkat edin; ödeme veya şifre taleplerine güvenmeyin.'"></p>
    </div>
  </div>

  <h1 x-text="selectedMail?.subject || '(konu yok)'"></h1>

  <div class="wm-message-from">
    <div class="wm-message-from__avatar"
         :style="'background:' + avatarColor(selectedMail?.from_addr || selectedMail?.from)"
         x-text="initials(displayFrom(selectedMail))"></div>
    <div class="wm-message-from__details">
      <div class="wm-message-from__name" x-text="displayFrom(selectedMail)"></div>
      <dl class="wm-sender-dl">
        <template x-if="selectedMail?.from_addr">
          <div class="wm-sender-dl__row">
            <dt>From</dt>
            <dd x-text="selectedMail.from_addr"></dd>
          </div>
        </template>
        <template x-if="selectedMail?.sender_return_path && selectedMail.sender_return_path !== selectedMail.from_addr">
          <div class="wm-sender-dl__row">
            <dt>Return-Path</dt>
            <dd x-text="selectedMail.sender_return_path"></dd>
          </div>
        </template>
        <template x-if="selectedMail?.sender_reply_to">
          <div class="wm-sender-dl__row">
            <dt>Reply-To</dt>
            <dd x-text="selectedMail.sender_reply_to"></dd>
          </div>
        </template>
        <template x-if="selectedMail?.sender_real_email && selectedMail.is_spoofed">
          <div class="wm-sender-dl__row wm-sender-dl__row--highlight">
            <dt>Gerçek kaynak</dt>
            <dd x-text="selectedMail.sender_real_email"></dd>
          </div>
        </template>
      </dl>
    </div>
  </div>
</header>
<div class="wm-message-body" x-html="selectedMail?.body || '<p>İçerik yükleniyor…</p>'"></div>
