<div class="flex flex-col h-full p-2">
  <h3 class="text-xs font-semibold text-[var(--wm-accent)] mb-2">AI Asistan</h3>
  <div class="flex-1 overflow-y-auto space-y-2 text-xs mb-2">
    <template x-for="(m, i) in aiMessages" :key="i">
      <div :class="m.role==='user' ? 'text-right' : 'text-left'">
        <span class="wm-chip inline-block max-w-full whitespace-pre-wrap" x-text="m.text"></span>
      </div>
    </template>
    <p x-show="aiLoading" class="text-[var(--wm-muted)]">Düşünüyor…</p>
  </div>
  <textarea class="wm-textarea text-xs" rows="2" placeholder="Örn: yarın 09:00 admin@x.com'a teşekkür maili yaz" x-model="aiInput" @keydown.enter.prevent="sendAi()"></textarea>
  <button type="button" class="wm-btn wm-btn-primary mt-2 w-full" @click="sendAi()" :disabled="aiLoading">Gönder</button>
</div>
