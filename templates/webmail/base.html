{% load static %}
<!DOCTYPE html>
<html lang="tr" class="dark wm-html">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="csrf-token" content="{{ csrf_token }}">
    <meta name="theme-color" content="#0f172a">
    <meta name="color-scheme" content="dark">
    <title>{% block title %}Webmail — Jîr-Mail{% endblock %}</title>
    <link rel="icon" type="image/svg+xml" href="{% static 'brand/favicon.svg' %}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/main.css' %}">
    <link rel="stylesheet" href="{% static 'css/brand.css' %}">
    <link rel="stylesheet" href="{% url 'webmail:asset' asset_path='css/webmail-proton.css' %}?v=20260521">
    <link href="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.snow.css" rel="stylesheet">
    {% block extra_head %}{% endblock %}
</head>
<body class="bg-slate-950 text-slate-200 font-sans antialiased overflow-hidden h-dvh">
    {% block body %}{% endblock %}
    <div id="wm-toast-root" class="wm-toast-root" aria-live="polite"></div>
    <script src="{% url 'webmail:asset' asset_path='js/webmail/theme.js' %}?v=20260521"></script>
    <script src="{% url 'webmail:asset' asset_path='js/webmail/core.js' %}?v=20260521"></script>
    <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/quill@2.0.2/dist/quill.js"></script>
    {% block extra_scripts %}{% endblock %}
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</body>
</html>
