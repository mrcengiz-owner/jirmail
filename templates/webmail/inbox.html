{% extends "webmail/base.html" %}
{% load static %}

{% block title %}Webmail — JîrCode Mail{% endblock %}

{% block body %}
<div class="flex h-dvh w-full overflow-hidden bg-slate-950" x-data="mailApp()">

    <!-- Column 1: Folder Sidebar -->
    <aside class="bg-slate-900 border-r border-slate-800 flex-col h-full shrink-0 w-full md:w-64"
           :class="mobileView === 'folders' ? 'flex' : 'hidden md:flex'">

        <div class="h-14 px-4 flex items-center justify-between border-b border-slate-800 shrink-0">
            <a href="{% url 'webmail:inbox' %}" class="flex items-center gap-2.5 min-w-0">
                <img src="{% static 'brand/logo-icon.svg' %}" alt="JîrCode" class="w-9 h-9 rounded-xl shrink-0">
                <div class="min-w-0 leading-tight">
                    <p class="jir-wordmark text-base text-white truncate">Jîr<span class="jir-text-gradient">Code</span></p>
                    <p class="text-[10px] font-semibold uppercase tracking-[0.2em] text-emerald-400">Webmail</p>
                </div>
            </a>
        </div>

        <div class="p-3 border-b border-slate-800/70">
            <button @click="showCompose = true; mobileView = 'detail'" class="btn btn-primary w-full">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>
                Yeni Mesaj
            </button>
        </div>

        <nav class="flex-1 px-2 py-3 overflow-y-auto custom-scrollbar space-y-0.5" aria-label="Klasörler">
            <div class="px-3 py-2">
                <span class="text-[10px] font-bold text-slate-500 uppercase tracking-[0.15em]">Mailboxes</span>
            </div>

            <button type="button" @click="switchFolder('inbox')"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors"
                    :class="currentFolder === 'inbox' ? 'bg-primary-500/10 text-primary-300 border border-primary-500/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent'">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                </svg>
                <span>Gelen Kutusu</span>
                <span x-show="unreadCount > 0"
                      class="ml-auto bg-primary-500/20 text-primary-300 px-2 py-0.5 rounded-full text-xs font-bold tabular-nums"
                      x-text="unreadCount"></span>
            </button>

            <button type="button" @click="switchFolder('starred')"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors"
                    :class="currentFolder === 'starred' ? 'bg-primary-500/10 text-primary-300 border border-primary-500/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent'">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                </svg>
                <span>Yıldızlı</span>
            </button>

            <button type="button" @click="switchFolder('sent')"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors"
                    :class="currentFolder === 'sent' ? 'bg-primary-500/10 text-primary-300 border border-primary-500/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent'">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                </svg>
                <span>Gönderilen</span>
            </button>

            <button type="button" @click="switchFolder('drafts')"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors"
                    :class="currentFolder === 'drafts' ? 'bg-primary-500/10 text-primary-300 border border-primary-500/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent'">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
                <span>Taslaklar</span>
            </button>

            <button type="button" @click="switchFolder('trash')"
                    class="w-full flex items-center gap-3 px-3 py-2.5 rounded-xl text-sm font-medium transition-colors"
                    :class="currentFolder === 'trash' ? 'bg-primary-500/10 text-primary-300 border border-primary-500/20' : 'text-slate-400 hover:bg-slate-800/60 hover:text-white border border-transparent'">
                <svg class="w-5 h-5 shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                </svg>
                <span>Çöp Kutusu</span>
            </button>
        </nav>

        <div class="p-3 border-t border-slate-800 shrink-0">
            {% if is_admin %}
            <a href="{% url 'dashboard' %}" class="flex items-center gap-2 mb-2 px-2 py-1.5 rounded-lg text-xs text-slate-400 hover:bg-slate-800/60 hover:text-white transition-colors">
                <svg class="w-4 h-4 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.066 2.573c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.573 1.066c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.066-2.573c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/>
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/>
                </svg>
                Yönetim paneli
            </a>
            {% endif %}
            <div class="flex items-center gap-3 mb-2 px-2 py-1.5">
                <div class="w-9 h-9 bg-gradient-to-br from-primary-500 to-primary-700 rounded-full flex items-center justify-center text-white font-bold text-sm shrink-0">
                    {{ email|slice:":1"|upper }}
                </div>
                <div class="min-w-0 flex-1">
                    <p class="text-sm font-medium text-white truncate">{{ email }}</p>
                    <p class="text-xs text-slate-500">Bağlı</p>
                </div>
            </div>
            <form method="POST" action="{% url 'webmail:logout' %}">
                {% csrf_token %}
                <button type="submit" class="w-full flex items-center justify-center gap-2 px-3 py-2 rounded-xl text-slate-400 hover:bg-danger-500/10 hover:text-danger-400 transition-colors text-sm">
                    <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/>
                    </svg>
                    Çıkış Yap
                </button>
            </form>
        </div>
    </aside>

    <!-- Column 2: Mail List -->
    <section class="bg-slate-900/60 border-r border-slate-800 flex-col shrink-0 w-full md:w-80 lg:w-96"
             :class="mobileView === 'list' ? 'flex' : 'hidden md:flex'">

        <!-- Mobile header: hamburger + title -->
        <div class="md:hidden h-14 flex items-center gap-1 px-2 border-b border-slate-800 shrink-0">
            <button @click="mobileView = 'folders'" aria-label="Klasörleri aç" class="icon-btn">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
            </button>
            <span class="font-semibold text-white flex-1 truncate" x-text="folderLabel()"></span>
            <button @click="showCompose = true; mobileView = 'detail'" aria-label="Yeni mesaj" class="icon-btn text-primary-400">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/>
                </svg>
            </button>
        </div>

        <!-- Search -->
        <div class="p-3 border-b border-slate-800 shrink-0">
            <div class="relative">
                <svg class="absolute left-3 top-1/2 -translate-y-1/2 h-4 w-4 text-slate-500 pointer-events-none" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                </svg>
                <input type="search" x-model="searchQuery" placeholder="Mail içeriklerinde ara..."
                       aria-label="Mail içeriklerinde ara"
                       class="input pl-10" style="min-height:42px;padding-top:0.5rem;padding-bottom:0.5rem;">
            </div>
        </div>

        <!-- List -->
        <div class="flex-1 overflow-y-auto custom-scrollbar">
            <template x-for="mail in filteredMails" :key="mail.id">
                <button @click="selectMail(mail); mobileView = 'detail'"
                        class="w-full text-left p-4 border-b border-slate-800/40 hover:bg-slate-800/40 transition-colors relative pr-8"
                        :class="selectedMail && selectedMail.id === mail.id ? 'bg-slate-800/60' : ''">
                    <span x-show="selectedMail && selectedMail.id === mail.id"
                          class="absolute left-0 inset-y-2 w-0.5 bg-primary-500 rounded-r"></span>
                    <span class="absolute bottom-3 right-3 w-2.5 h-2.5 rounded-full ring-2 ring-slate-900"
                          :class="mailStatusDotClass(mail)"
                          :title="mailStatusTitle(mail)"></span>
                    <div class="flex items-start justify-between gap-2 mb-1">
                        <div class="flex items-center gap-2 min-w-0">
                            <span x-show="mail.unread && currentFolder === 'inbox'" class="w-2 h-2 rounded-full bg-primary-500 shrink-0"></span>
                            <span class="truncate text-sm"
                                  :class="mail.unread ? 'font-semibold text-white' : 'text-slate-400'"
                                  x-text="mail.from"></span>
                        </div>
                        <span class="text-[11px] text-slate-500 shrink-0 tabular-nums" x-text="formatDate(mail.date)"></span>
                    </div>
                    <div class="text-sm truncate mb-1"
                         :class="mail.unread ? 'font-semibold text-primary-300' : 'text-slate-400'"
                         x-text="mail.subject"></div>
                    <div class="text-xs text-slate-500 truncate" x-text="mail.preview"></div>
                </button>
            </template>
            <template x-if="filteredMails.length === 0">
                <div class="empty-state">
                    <div class="empty-state-icon">
                        <svg class="w-8 h-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                        </svg>
                    </div>
                    <p class="text-sm text-slate-500"><span class="capitalize" x-text="currentFolder"></span> klasöründe mail yok</p>
                </div>
            </template>
        </div>
    </section>

    <!-- Column 3: Detail / Compose -->
    <section class="flex-1 bg-slate-950 flex-col min-w-0"
             :class="mobileView === 'detail' ? 'flex' : 'hidden md:flex'">

        <!-- Mobile back header -->
        <div class="md:hidden h-14 flex items-center gap-2 px-3 border-b border-slate-800 shrink-0">
            <button @click="mobileView = 'list'; selectedMail = null; closeCompose()" aria-label="Listeye dön" class="icon-btn">
                <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>
            <span class="font-medium text-white truncate flex-1" x-text="showCompose ? (composeType === 'reply' ? 'Yanıtla' : composeType === 'forward' ? 'Yönlendir' : 'Yeni Mesaj') : (selectedMail ? selectedMail.subject : '')"></span>
        </div>

        <!-- Empty state -->
        <template x-if="!showCompose && !selectedMail">
            <div class="flex-1 flex flex-col items-center justify-center p-8 text-center">
                <div class="w-20 h-20 bg-slate-900 rounded-full flex items-center justify-center mb-4 border border-slate-800">
                    <svg class="w-10 h-10 text-slate-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M3 8l7.89 5.26a2 2 0 002.22 0L21 8M5 19h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v10a2 2 0 002 2z"/>
                    </svg>
                </div>
                <p class="text-base font-medium text-slate-500">Görüntülemek için bir mail seçin</p>
                <button @click="showCompose = true; mobileView = 'detail'" class="btn btn-primary mt-4">
                    Yeni Mesaj Oluştur
                </button>
            </div>
        </template>

        <!-- Reading pane -->
        <template x-if="!showCompose && selectedMail">
            <div class="flex flex-col h-full">
                <div class="p-4 sm:p-6 border-b border-slate-800 bg-slate-900/30 shrink-0">
                    <div class="flex items-start justify-between gap-3 mb-4">
                        <h2 class="text-lg sm:text-xl font-bold text-white leading-tight min-w-0 break-words" x-text="selectedMail.subject"></h2>
                        <div class="flex items-center gap-1 shrink-0">
                            <button @click="toggleStar(selectedMail)" aria-label="Yıldızla"
                                    class="icon-btn"
                                    :class="selectedMail.starred ? 'text-amber-400' : ''">
                                <svg class="h-4 w-4" fill="currentColor" viewBox="0 0 24 24">
                                    <path d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.197-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.784-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z"/>
                                </svg>
                            </button>
                            <button @click="deleteMail(selectedMail)" aria-label="Sil"
                                    class="icon-btn hover:text-danger-400 hover:bg-danger-500/10">
                                <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                                </svg>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center gap-3 p-3 bg-slate-900 rounded-xl border border-slate-800">
                        <div class="w-10 h-10 bg-gradient-to-br from-primary-500 to-primary-700 rounded-xl flex items-center justify-center text-white font-bold shrink-0"
                             x-text="selectedMail.from.charAt(0).toUpperCase()"></div>
                        <div class="flex-1 min-w-0">
                            <div class="font-semibold text-white text-sm truncate" x-text="selectedMail.from"></div>
                            <div class="text-xs text-slate-500 truncate">→ {{ email }}</div>
                        </div>
                        <div class="text-[11px] text-slate-400 chip shrink-0 hidden sm:flex" x-text="formatDateTime(selectedMail.date)"></div>
                    </div>
                </div>
                <div class="flex-1 p-4 sm:p-6 overflow-y-auto custom-scrollbar">
                    <div class="text-slate-300 leading-relaxed text-sm sm:text-[15px] max-w-prose" x-html="formatBody(selectedMail.body)"></div>
                </div>
                <div class="p-3 sm:p-4 border-t border-slate-800 bg-slate-900/30 flex items-center gap-2 shrink-0">
                    <button @click="replyTo(selectedMail)" class="btn btn-primary flex-1 sm:flex-none">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/>
                        </svg>
                        Yanıtla
                    </button>
                    <button @click="forwardMail(selectedMail)" class="btn btn-secondary flex-1 sm:flex-none">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 5l7 7-7 7M5 5l7 7-7 7"/>
                        </svg>
                        Yönlendir
                    </button>
                </div>
            </div>
        </template>

        <!-- Compose pane -->
        <template x-if="showCompose">
            <div class="flex flex-col h-full">
                <div class="hidden md:flex p-4 border-b border-slate-800 items-center justify-between shrink-0">
                    <h2 class="text-lg font-bold text-white"
                        x-text="composeType === 'reply' ? 'Yanıtla' : composeType === 'forward' ? 'Yönlendir' : 'Yeni Mesaj'"></h2>
                    <button @click="closeCompose(); mobileView = 'list'" aria-label="Kapat" class="icon-btn">
                        <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                </div>
                <div class="p-4 sm:p-5 space-y-3 flex-1 overflow-y-auto custom-scrollbar">
                    <div>
                        <label class="label">Kime</label>
                        <input type="email" x-model="composeTo" placeholder="alici@example.com" class="input" autocomplete="email">
                    </div>
                    <div>
                        <label class="label">Konu</label>
                        <input type="text" x-model="composeSubject" placeholder="Mesajınızın konusu" class="input">
                    </div>
                    <div>
                        <label class="label">Mesaj</label>
                        <textarea x-model="composeBody" placeholder="Mesajınızı buraya yazın..."
                                  class="input min-h-[200px] sm:min-h-[300px] resize-none" rows="10"></textarea>
                    </div>
                </div>
                <div class="p-3 sm:p-4 border-t border-slate-800 flex items-center justify-between gap-2 bg-slate-900/30 shrink-0">
                    <button @click="saveDraft()" class="btn btn-ghost btn-sm">Taslağı Kaydet</button>
                    <button @click="sendMail()" :disabled="sendingMail" class="btn btn-primary">
                        <template x-if="sendingMail">
                            <svg class="animate-spin h-4 w-4" fill="none" viewBox="0 0 24 24">
                                <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                                <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path>
                            </svg>
                        </template>
                        <svg x-show="!sendingMail" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
                        </svg>
                        <span x-text="sendingMail ? 'Gönderiliyor...' : 'Gönder'"></span>
                    </button>
                </div>
            </div>
        </template>
    </section>

</div>
{% endblock %}
