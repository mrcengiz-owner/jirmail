{% extends 'webmail/base.html' %}

{% block title %}Giriş — Jîr-Mail{% endblock %}

{% block body %}
<div class="wm-login-page">
  <div class="wm-login-card" x-data="webmailLoginForm()">
    <div class="wm-login-card__brand">
      <img src="{% url 'webmail:asset' asset_path='brand/logo-icon.svg' %}" alt="Jîr-Mail">
      <h1>Jîr<span>Mail</span></h1>
      <p>Güvenli web posta — şifreli bağlantı</p>
    </div>

    <form @submit.prevent="login()" novalidate>
      <div class="wm-form-group">
        <label for="email">E-posta adresi</label>
        <input id="email" type="email" x-model="email" autocomplete="username" required
               placeholder="siz@domain.com" :class="emailError && 'wm-input-error'">
      </div>
      <div class="wm-form-group">
        <label for="password">Şifre</label>
        <input id="password" type="password" x-model="password" autocomplete="current-password" required
               placeholder="••••••••" :class="passwordError && 'wm-input-error'">
      </div>
      <div x-show="errorMessage" x-cloak class="wm-alert wm-alert--error" x-text="errorMessage"></div>
      <button type="submit" class="wm-btn wm-btn-primary wm-w-full" :disabled="isLoading">
        <span x-text="isLoading ? 'Giriş yapılıyor…' : 'Gelen kutusuna gir'"></span>
      </button>
    </form>

    <p class="wm-login-footer">
      <a href="{% url 'login' %}">Yönetim paneli girişi</a>
    </p>
  </div>
</div>
{% endblock %}

{% block extra_scripts %}
<script>
function webmailLoginForm() {
    return {
        email: '',
        password: '',
        isLoading: false,
        errorMessage: '',
        emailError: false,
        passwordError: false,
        async login() {
            this.emailError = false;
            this.passwordError = false;
            this.errorMessage = '';
            if (!this.email) { this.emailError = true; this.errorMessage = 'E-posta gerekli'; return; }
            if (!this.password) { this.passwordError = true; this.errorMessage = 'Şifre gerekli'; return; }
            this.isLoading = true;
            try {
                const csrfToken = (document.querySelector('meta[name="csrf-token"]') || {}).content || '';
                const res = await fetch('/login-success/', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'X-CSRFToken': csrfToken },
                    body: JSON.stringify({ email: this.email, password: this.password })
                });
                const data = await res.json();
                if (data.status === 'success') {
                    window.location.href = data.redirect_url || '/webmail/';
                } else {
                    this.errorMessage = data.message || 'Giriş başarısız.';
                }
            } catch (e) {
                this.errorMessage = 'Sunucuya bağlanılamıyor.';
            } finally {
                this.isLoading = false;
            }
        }
    };
}
</script>
{% endblock %}
