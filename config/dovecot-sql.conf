# Dovecot SQL Passdb Configuration for Jîr-Mail
# Bu dosya örnek/şablondur — gerçek credential ASLA commit edilmemeli.
# Çalışan konfig: env / docker template (dovecot/dovecot-sql.conf.ext.tpl) ile üretilir.

driver = pgsql
connect = host=${POSTGRES_HOST:postgres} port=${POSTGRES_PORT:5432} dbname=${POSTGRES_DB:jir_mail_prod} user=${POSTGRES_USER:postgres} password=${POSTGRES_PASSWORD}
default_pass_scheme = BLF-CRYPT
password_query = SELECT email as user, password_hash AS password, 'maildir:/var/mail/vhosts/%d/%n' AS userdb_home, 'maildir:/var/mail/vhosts/%d/%n' AS mail, 5000 AS uid, 5000 AS gid FROM core_mailaccount WHERE email = '%u' AND is_active = true

# Optional: debug için
# log_path = /var/log/dovecot-sql.log
