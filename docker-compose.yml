# Jîr-Mail — tek stack (panel + Postgres + Redis + Postfix + Dovecot).
# Dokploy / Coolify: kaynak türü "Docker Compose", bu dosya. Host'ta elle jir_* kurmayın.

services:

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jir_django
    restart: unless-stopped
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "120", "config.wsgi:application"]
    environment:
      JIR_COMPOSE_STACK: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jir_mail_prod}
      POSTGRES_DB: ${POSTGRES_DB:-jir_mail_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      MAIL_DOMAIN: ${MAIL_DOMAIN:-jircode.com}
      MAIL_HOSTNAME: ${MAIL_HOSTNAME:-mail.jircode.com}
      SMTP_HOST: postfix
      SMTP_PORT: "587"
      IMAP_HOST: dovecot
      IMAP_PORT: "993"
      MAIL_TLS_MODE: e2e
      MAIL_TLS_CA_FILE: /etc/jir-mail/tls/ca.crt
      JIR_LOCAL_KEY: ${JIR_LOCAL_KEY:-change-me}
      PYTHONUNBUFFERED: "1"
      DEBUG: "False"
    volumes:
      - config_data:/app/config
      - jir_mail_tls:/etc/jir-mail/tls
    expose:
      - "8000"
    # Traefik: Dokploy UI → Domains → django:8000 (compose labels ile Host() çakışmasın)
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      postfix:
        condition: service_started
      dovecot:
        condition: service_started
    networks:
      - jir_network
      - dokploy-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jir_celery
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      JIR_COMPOSE_STACK: "1"
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jir_mail_prod}
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    volumes:
      - config_data:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jir_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jir_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment:
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jir_network

  redis:
    image: redis:7-alpine
    container_name: jir_redis
    restart: unless-stopped
    volumes:
      - redis_data:/data
    networks:
      - jir_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: jir_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jir_mail_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD zorunlu}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jir_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-jir_mail_prod}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postfix:
    image: boky/postfix:latest
    container_name: jir_postfix
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:-mail.jircode.com}
    environment:
      ALLOWED_SENDER_DOMAINS: ${MAIL_DOMAIN:-jircode.com}
      HOSTNAME: ${MAIL_HOSTNAME:-mail.jircode.com}
      POSTFIX_smtpd_tls_security_level: encrypt
      POSTFIX_smtpd_tls_cert_file: /etc/jir-mail/tls/server.crt
      POSTFIX_smtpd_tls_key_file: /etc/jir-mail/tls/server.key
      POSTFIX_smtpd_tls_CAfile: /etc/jir-mail/tls/ca.crt
      POSTFIX_smtpd_tls_auth_only: "yes"
    volumes:
      - postfix_data:/etc/postfix
      - mail_data:/var/mail
      - jir_mail_tls:/etc/jir-mail/tls:ro
    ports:
      - "${POSTFIX_PORT_25:-25}:25"
      - "${POSTFIX_PORT_587:-587}:587"
    networks:
      - jir_network

  dovecot:
    build:
      context: ./dovecot
      dockerfile: Dockerfile
    container_name: jir_dovecot
    restart: unless-stopped
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: ${POSTGRES_DB:-jir_mail_prod}
      DB_USER: ${POSTGRES_USER:-postgres}
      DB_PASS: ${POSTGRES_PASSWORD}
      MAIL_DOMAIN: ${MAIL_DOMAIN:-jircode.com}
    volumes:
      - mail_data:/var/mail
      - jir_mail_tls:/etc/jir-mail/tls:ro
    ports:
      - "${DOVECOT_PORT_IMAP:-993}:993"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - jir_network

volumes:
  postgres_data:
    name: jir_postgres_data
  redis_data:
    name: jir_redis_data
  postfix_data:
    name: jir_postfix_data
  mail_data:
    name: jir_mail_data
  jir_mail_tls:
    name: jir_mail_tls
  config_data:
    name: jir_config_data

networks:
  jir_network:
    driver: bridge
  dokploy-network:
    external: true
    name: dokploy-network