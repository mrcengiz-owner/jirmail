version: '3.8'

services:

  # ─── Docker Socket Proxy (Güvenli Docker API erişimi) ─────────────────────
  docker-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: jir_docker_proxy
    restart: unless-stopped
    environment:
      - CONTAINERS=1   # container listesi
      - INFO=1         # sistem bilgisi
      - PING=1         # health check
      - STATS=1        # istatistikler
      - POST=0         # yazma işlemleri kapalı (güvenlik)
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - jir_network
    privileged: true

  django:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jir_django
    restart: unless-stopped
    entrypoint: ["./docker-entrypoint.sh"]
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "4", "--timeout", "60", "config.wsgi:application"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JIR_LOCAL_KEY=${JIR_LOCAL_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - POSTFIX_VMAIL_PATH=/etc/postfix/vmail_accounts
      - DOVECOT_PASSDB_PATH=/etc/dovecot/userdb
      - PYTHONUNBUFFERED=1
      - DEBUG=False
      # Docker Socket Proxy URL — doğrudan socket yerine proxy kullan
      - DOCKER_HOST=tcp://docker-proxy:2375
    volumes:
      - config_data:/app/config
      - postfix_data:/etc/postfix
      - dovecot_data:/etc/dovecot
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-proxy:
        condition: service_started
    networks:
      - jir_network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/management/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  celery:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jir_celery
    restart: unless-stopped
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JIR_LOCAL_KEY=${JIR_LOCAL_KEY}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - static_data:/app/static
      - config_data:/app/config
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - jir_network

  celery-beat:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jir_celery_beat
    restart: unless-stopped
    command: ["celery", "-A", "config", "beat", "--loglevel=info"]
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - jir_network

  redis:
    image: redis:7-alpine
    container_name: jir_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - jir_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17
    container_name: jir_postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-jir_mail_prod}
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - jir_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  postfix:
    image: boky/postfix:latest
    container_name: jir_postfix
    restart: unless-stopped
    hostname: ${MAIL_HOSTNAME:-mail.jircode.com}
    environment:
      - ALLOWED_SENDER_DOMAINS=${MAIL_DOMAIN:-jircode.com}
    volumes:
      - postfix_data:/etc/postfix
      - mail_data:/var/mail
    ports:
      - "${POSTFIX_PORT_25:-25}:25"
      - "${POSTFIX_PORT_587:-587}:587"
    networks:
      - jir_network

  dovecot:
    build:
      context: .
      dockerfile: dovecot/Dockerfile
    container_name: jir_dovecot
    restart: unless-stopped
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-jir_mail_prod}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASS=${POSTGRES_PASSWORD}
    volumes:
      - dovecot_data:/etc/dovecot
      - mail_data:/var/mail
    ports:
      - "${DOVECOT_PORT_IMAP:-993}:993"
      - "${DOVECOT_PORT_POP3:-143}:143"
    depends_on:
      - postgres
    networks:
      - jir_network

volumes:
  postgres_data:
  postfix_data:
  dovecot_data:
  mail_data:
  static_data:
  config_data:
  redis_data:

networks:
  jir_network:
    driver: bridge
